name: Local Vision Lab

on:
  pull_request:
    paths:
      - "vision_lab/**"
      - ".github/workflows/vision-lab.yml"
  push:
    branches: [main]
    paths:
      - "vision_lab/**"
      - ".github/workflows/vision-lab.yml"

permissions:
  contents: read

jobs:
  local-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install Pillow==13.0.0 setuptools==82.0.1
      - run: python -m pip install --no-build-isolation --no-deps -e vision_lab
      - run: python -m unittest discover -s vision_lab/tests
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node --check vision_lab/findez_vision/web/app.js
