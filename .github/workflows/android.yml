name: Android foundation

on:
  pull_request:
    paths: ['mobile/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub test/android_auth_test.dart test/auth_eligibility_test.dart test/world_auth_handoff_test.dart
      - name: Compile debug APK with placeholder services
        run: >-
          flutter build apk --debug --no-pub
          --dart-define=SUPABASE_URL=https://android-ci.example.invalid
          --dart-define=SUPABASE_ANON_KEY=android-ci-placeholder
          --dart-define=API_BASE_URL=https://android-ci.example.invalid
      - uses: actions/upload-artifact@v4
        with:
          name: findez-android-compile-check
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
