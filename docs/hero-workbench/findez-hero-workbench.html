<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FindEZ | AI for the physical world</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Inter+Tight:wght@400;500&family=Plus+Jakarta+Sans:wght@600&family=Geist+Mono:wght@400;500&display=swap">
<style>

:root{--ink:#F4F4F5;--ink2:#A1A1A6;--ink3:#6B6B70;--bg:#0D0D0F;--e:cubic-bezier(.32,.72,0,1);
 --f:'Inter',system-ui,sans-serif;--mono:'Geist Mono',ui-monospace,monospace;
 --ember:linear-gradient(100deg,#F3A24C 0%,#E2622F 48%,#B8392A 100%)}
*{box-sizing:border-box;margin:0}
html,body{background:var(--bg)}
body{font-family:var(--f);color:var(--ink);-webkit-font-smoothing:antialiased;letter-spacing:-.011em;overflow-x:hidden}
a{color:inherit;text-decoration:none}button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}

.hdr{position:fixed;inset:0 0 auto;z-index:50}
.band{display:flex;align-items:center;justify-content:center;gap:10px;height:40px;background:#18181B;color:#fff;font-size:13.5px;font-weight:500;overflow:hidden;transition:height .45s var(--e)}
.band .new{font-size:11.5px;padding:3px 8px;border-radius:999px;background:rgba(255,255,255,.12)}
.band .arr{display:inline-flex;transition:transform .35s var(--e)}.band:hover .arr{transform:translateX(3px)}
.hdr.up .band{height:0}
.nav{height:64px;background:rgba(13,13,15,.7);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.nav .in{width:min(1200px,calc(100vw - 40px));height:100%;margin:0 auto;display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
.brand{display:flex;align-items:center;gap:8px;font-family:'Plus Jakarta Sans',var(--f);font-size:20px;font-weight:600;letter-spacing:-.03em}
.menu{display:flex;gap:4px;font-size:14.5px}.menu a{padding:8px 12px;border-radius:999px;color:#D4D4D8}.menu a:hover{color:#fff}
.links{justify-self:end;display:flex;align-items:center;gap:8px;font-size:14.5px;font-weight:500}.links a{padding:8px 12px}
.links .go{background:#fff;color:#0B0B0C;border-radius:999px;padding:9px 15px}

#hero{position:relative;height:100vh;min-height:780px;overflow:hidden;isolation:isolate}
.bg{position:absolute;inset:0;z-index:0;opacity:0;visibility:hidden;transition:opacity .8s var(--e),visibility .8s}
.bg.on{opacity:1;visibility:visible}
.veil{position:absolute;inset:0;z-index:2;pointer-events:none;background:radial-gradient(42% 36% at 50% 50%,rgba(13,13,15,.96) 30%,rgba(13,13,15,.6) 65%,rgba(13,13,15,0) 100%)}

/* A: the workbench, read in the dark */
#bgA .ph{position:absolute;inset:0;background-size:cover;background-position:50% 72%;filter:brightness(.36) saturate(.7) contrast(1.05);transform:scale(1.04);animation:kb 40s ease-in-out infinite alternate}
@keyframes kb{to{transform:scale(1.1) translate(-1%,-1%)}}
#bgA .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(13,13,15,.85) 0%,rgba(13,13,15,.2) 25%,rgba(13,13,15,.15) 75%,rgba(13,13,15,.9) 100%)}
#boxes{position:absolute;inset:0;z-index:1}
.bx{position:absolute;border:1.5px solid rgba(255,255,255,.9);border-radius:10px;opacity:0;transform:scale(1.06);transition:opacity .7s var(--e),transform .8s var(--e);box-shadow:0 0 0 1px rgba(0,0,0,.25),0 0 30px rgba(255,255,255,.06)}
.bx.on{opacity:1;transform:none}
.bx em{position:absolute;left:-1.5px;top:-26px;font:500 11.5px var(--mono);font-style:normal;color:#0B0B0C;background:#fff;border-radius:6px;padding:3px 7px;white-space:nowrap}
.bx em.below{top:auto;bottom:-26px}

/* B: everything you own, connected */
#cv{position:absolute;inset:0;width:100%;height:100%}
#labels{position:absolute;inset:0}
.nd{position:absolute;transform:translate(-5px,-5px);display:flex;align-items:center;gap:9px;white-space:nowrap;font:500 12.5px var(--mono);color:rgba(244,244,245,.55);transition:color .5s}
.nd i{width:9px;height:9px;border-radius:50%;background:rgba(244,244,245,.5);flex:none;transition:background .5s,box-shadow .5s}
.nd small{font:500 11.5px var(--f);color:#0B0B0C;background:#fff;border-radius:999px;padding:3px 9px;opacity:0;transform:translateX(-4px);transition:opacity .45s var(--e),transform .5s var(--e)}
.nd.hot{color:#fff}.nd.hot i{background:#F08A3C;box-shadow:0 0 0 6px rgba(240,138,60,.16),0 0 24px rgba(240,138,60,.6)}
.nd.hot small{opacity:1;transform:none}

/* C: one warm light behind the box */
#bgC .dots{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.09) 1px,transparent 1.2px);background-size:26px 26px;-webkit-mask-image:radial-gradient(60% 55% at 50% 50%,#000 0%,transparent 75%);mask-image:radial-gradient(60% 55% at 50% 50%,#000 0%,transparent 75%)}
#bgC .orb{position:absolute;left:50%;top:56%;border-radius:50%;filter:blur(80px)}
#bgC .o1{width:620px;height:420px;margin:-210px 0 0 -310px;background:#D5602A;opacity:.38;animation:o1 16s ease-in-out infinite alternate}
#bgC .o2{width:520px;height:380px;margin:-190px 0 0 -260px;background:#3E4C86;opacity:.4;animation:o2 19s ease-in-out infinite alternate}
#bgC .o3{width:380px;height:300px;margin:-150px 0 0 -190px;background:#8A2F3C;opacity:.35;animation:o3 23s ease-in-out infinite alternate}
@keyframes o1{from{transform:translate(-160px,-40px)}to{transform:translate(120px,30px)}}
@keyframes o2{from{transform:translate(180px,40px)}to{transform:translate(-140px,-30px)}}
@keyframes o3{from{transform:translate(0,90px) scale(.9)}to{transform:translate(40px,-60px) scale(1.15)}}
#bgC .grain{position:absolute;inset:0;opacity:.1;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 1.2 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
body.c .veil{background:none}

.center{position:absolute;z-index:3;left:50%;top:50%;transform:translate(-50%,-50%);width:min(680px,calc(100vw - 40px));text-align:center}
h1{font-family:'Inter Tight',var(--f);font-weight:400;font-size:clamp(38px,4.4vw,64px);line-height:1.04;letter-spacing:-.022em}
h1 .em{background:var(--ember);-webkit-background-clip:text;background-clip:text;color:transparent}
.comp{position:relative;margin:36px auto 0;background:#fff;border-radius:22px;box-shadow:0 0 0 1px rgba(255,255,255,.08),0 24px 60px rgba(0,0,0,.5);padding:15px 12px 11px 18px;text-align:left;color:#0B0B0C}
body.c .comp::before{content:"";position:absolute;inset:-1px;border-radius:23px;z-index:-1;box-shadow:0 0 70px rgba(226,98,47,.28);transition:box-shadow .6s}
body.c .comp.live::before{box-shadow:0 0 90px rgba(226,98,47,.45)}
.comp textarea{display:block;width:100%;resize:none;border:0;outline:0;background:transparent;font:400 17px/1.4 var(--f);color:#0B0B0C;height:26px;overflow:hidden;white-space:nowrap;letter-spacing:-.011em}
.comp textarea::placeholder{color:#8E8E93}
.crow{display:flex;align-items:center;gap:10px;margin-top:12px}.crow .sp{flex:1}
.cb{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;flex:none}.cb.o{box-shadow:inset 0 0 0 1px #ECEAE6}
.scanp{display:flex;align-items:center;gap:6px;height:32px;padding:0 13px 0 10px;border-radius:999px;background:#0B0B0C;color:#fff;font-weight:600;font-size:13px}
.hint{margin-top:16px;font-size:14px;color:var(--ink3)}

.swb{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:60;display:flex;gap:4px;padding:5px;border-radius:999px;background:rgba(40,40,44,.9);backdrop-filter:blur(10px);box-shadow:0 0 0 1px rgba(255,255,255,.08),0 10px 30px rgba(0,0,0,.4)}
.swb button{color:rgba(255,255,255,.6);font-size:13px;font-weight:500;padding:8px 14px;border-radius:999px}.swb button.on{background:#fff;color:#0B0B0C}

@media (max-width:900px){
 .menu{display:none}.nav .in{grid-template-columns:1fr auto}.links .lg{display:none}.band .new{display:none}
 .veil{background:radial-gradient(90% 34% at 50% 50%,rgba(13,13,15,.95) 40%,rgba(13,13,15,.55) 75%,rgba(13,13,15,0) 100%)}
 .nd{font-size:10.5px}.nd.mh{display:none}
 .swb span{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important}}
</style></head><body>

(() => {
const $ = s => document.getElementById(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const sleep = ms => new Promise(r => setTimeout(r, RM ? Math.min(ms, 40) : ms));
let gen = 0, cur = 'A';
const live = g => g === gen;
const q = $('q'), comp = $('comp');
let userTyping = false;
q.addEventListener('focus', () => { userTyping = true; q.placeholder = 'Describe your inventory'; });
q.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); location.href = 'https://www.findez.ai/signup?prompt=' + encodeURIComponent(q.value); } });
const centerRect = () => { const r = $('center').getBoundingClientRect(), h = $('hero').getBoundingClientRect(); return { l: r.left - h.left - 24, r: r.right - h.left + 24, t: r.top - h.top - 16, b: r.bottom - h.top + 4 }; };
async function typePH(s, g, speed = 28) { comp.classList.add('live'); for (let c = 1; c <= s.length; c++) { if (!live(g) || userTyping) return false; q.placeholder = s.slice(0, c); await sleep(speed); } comp.classList.remove('live'); return true; }
async function erasePH(g) { const s = q.placeholder; for (let c = s.length; c >= 0; c--) { if (!live(g) || userTyping) return; q.placeholder = s.slice(0, c) || ' '; await sleep(10); } }

/* ===== A: the workbench photo, objects recognised one by one ===== */
$('ph').style.backgroundImage = `url(${BENCH})`;
const OBJ = [['Black wheels', 3, [0, 660, 152, 905]], ['Stacked bins', 1, [10, 380, 362, 662]], ['Brass gears', 4, [400, 505, 572, 592]], ['Hex screws', 20, [495, 385, 615, 492]],
  ['Socket head screws', 12, [530, 715, 765, 865]], ['Gearbox housing', 4, [855, 770, 1290, 945]], ['Battery charger', 1, [765, 425, 1200, 660]],
  ['Lock washers', 60, [1370, 830, 1600, 965]], ['Bagged parts', 3, [150, 578, 425, 805]], ['Duct tape', 1, [575, 535, 772, 650]]];
function placeBoxes() {
  const host = $('boxes'), W = host.clientWidth, H = host.clientHeight; if (!W) return [];
  const sc = 1.04, k = Math.max(W / 1600, H / 1200) * sc, iw = 1600 * k, ih = 1200 * k, ox = (W - iw) * .5, oy = (H - ih) * .72;
  const c = centerRect(); host.innerHTML = '';
  return OBJ.map(([n, cnt, [x1, y1, x2, y2]]) => {
    let l = ox + x1 * k, t = oy + y1 * k, r = l + (x2 - x1) * k, bt = t + (y2 - y1) * k;
    l = Math.max(l, 10); t = Math.max(t, 124); r = Math.min(r, W - 10); bt = Math.min(bt, H - 12);
    if ((t + bt) / 2 > c.b && l < c.r && r > c.l) t = Math.max(t, c.b + 14);
    const w = r - l, h = bt - t; if (w < 60 || h < 50) return null;
    const ix = Math.max(0, Math.min(r, c.r) - Math.max(l, c.l)), iy = Math.max(0, Math.min(bt, c.b) - Math.max(t, c.t));
    if (ix * iy > w * h * .45) return null;
    const b = document.createElement('div'); b.className = 'bx'; Object.assign(b.style, { left: l + 'px', top: t + 'px', width: w + 'px', height: h + 'px' });
    b.innerHTML = `<em${t > c.b - 60 && t < c.b + 34 ? ' class="below"' : ''}>${n.toLowerCase()} · ${cnt}</em>`; host.appendChild(b); return b;
  }).filter(Boolean);
}
async function runA(g) {
  let boxes = placeBoxes(); let i = 0;
  (async () => { await sleep(1200); let k = 0; const ex = ['Garage workbench: charger, gearbox, socket screws', 'Parts drawer: 48 bearings, 60 washers, M4 screws', 'Kitchen pantry: rice, pasta, olive oil']; while (live(g) && !userTyping) { if (!await typePH(ex[k++ % ex.length], g)) return; await sleep(2400); await erasePH(g); await sleep(300); } })();
  await sleep(900);
  while (live(g)) {
    if (!boxes.length) { boxes = placeBoxes(); await sleep(500); continue; }
    const b = boxes[i % boxes.length]; i++;
    b.classList.add('on'); setTimeout(() => b.classList.remove('on'), RM ? 0 : 2900);
    await sleep(1500);
  }
}


function start() { const g = ++gen; requestAnimationFrame(() => runA(g)); }

start();
