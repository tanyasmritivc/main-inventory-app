<style>
/* shared chat (uses page tokens: --tx --tx2 --tx3 --line --line2 --card --bub --pri --onpri --soft --low) */
.fz{width:100%;max-width:720px;margin:0 auto;text-align:left;position:relative}
.fz-thread{height:0;overflow-y:auto;padding:0 4px;transition:height .55s cubic-bezier(.32,.72,0,1);scrollbar-width:none;-webkit-mask-image:linear-gradient(transparent,#000 14px,#000);mask-image:linear-gradient(transparent,#000 14px,#000)}
.fz-thread::-webkit-scrollbar{display:none}
.fz.open .fz-thread{height:var(--fzh,320px);padding:10px 4px 14px}
.fz-box{display:flex;align-items:flex-end;gap:6px;border-radius:28px;background:var(--card);box-shadow:inset 0 0 0 1px var(--line2),0 10px 34px rgba(0,0,0,.08);padding:7px;transition:box-shadow .25s}
.fz-box:focus-within{box-shadow:inset 0 0 0 1.5px var(--tx3),0 10px 34px rgba(0,0,0,.1)}
.fz-box textarea{flex:1;resize:none;height:44px;max-height:120px;padding:11px 6px 0;font:inherit;font-size:16.5px;line-height:1.3;color:var(--tx);background:none;border:0;outline:0}
.fz-box textarea::placeholder{color:var(--tx3)}
.fz-b{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;flex:none;color:var(--tx);background:none;border:0;cursor:pointer}
.fz-b:hover{background:var(--soft)}
.fz-b.go{background:var(--pri);color:var(--onpri)}
.fz-b.go:disabled{opacity:.3;cursor:default}
.fz-b svg,.fz svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.fz-chips{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;padding-top:14px}
.fz.open .fz-chips{display:none}
.fz-chip{height:32px;padding:0 14px;border-radius:16px;background:none;border:0;box-shadow:inset 0 0 0 1px var(--line2);color:var(--tx2);font:inherit;font-size:13.5px;cursor:pointer;white-space:nowrap}
.fz-chip:hover{background:var(--soft);color:var(--tx)}
.fz-pm{position:absolute;left:0;bottom:64px;width:240px;border-radius:18px;background:var(--card);box-shadow:0 18px 50px rgba(0,0,0,.18),0 0 0 1px var(--line);padding:6px;opacity:0;transform:translateY(6px);pointer-events:none;transition:all .22s cubic-bezier(.32,.72,0,1);z-index:5}
.fz.pmon .fz-pm{opacity:1;transform:none;pointer-events:auto}
.fz-pm button{width:100%;display:flex;gap:10px;align-items:center;padding:10px;border-radius:12px;font:inherit;font-size:14.5px;color:var(--tx);background:none;border:0;cursor:pointer;text-align:left}
.fz-pm button:hover{background:var(--soft)}
.fz-u{display:flex;justify-content:flex-end;margin-bottom:12px;animation:fzin .4s cubic-bezier(.32,.72,0,1) both}
.fz-u div{max-width:80%;padding:10px 15px;border-radius:20px 20px 6px 20px;background:var(--bub);font-size:15px;color:var(--tx)}
.fz-a{display:flex;gap:12px;margin-bottom:14px;animation:fzin .4s cubic-bezier(.32,.72,0,1) both}
.fz-a .m{width:28px;height:28px;border-radius:9px;background:var(--pri);color:var(--onpri);display:grid;place-items:center;flex:none}
.fz-a .b{flex:1;min-width:0;font-size:15px;line-height:1.55;padding-top:3px;color:var(--tx)}
.fz-a .b b{font-weight:600}
@keyframes fzin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.fz-dots{display:inline-flex;gap:4px;padding:8px 0}.fz-dots i{width:6px;height:6px;border-radius:50%;background:var(--tx3);animation:fzdt 1s infinite}.fz-dots i:nth-child(2){animation-delay:.15s}.fz-dots i:nth-child(3){animation-delay:.3s}
@keyframes fzdt{0%,100%{opacity:.3}50%{opacity:1}}
.fz-items{margin-top:10px;border-radius:16px;box-shadow:inset 0 0 0 1px var(--line);overflow:hidden;max-width:480px}
.fz-it{display:flex;align-items:center;gap:12px;padding:9px 12px}
.fz-it+.fz-it{border-top:1px solid var(--line)}
.fz-it .t{width:36px;height:36px;border-radius:10px;flex:none;background:center/cover #5B6680;display:grid;place-items:center;color:#fff}
.fz-it .tx{flex:1;min-width:0}.fz-it .tx b{display:block;font-size:14.5px;font-weight:500}.fz-it .tx small{font-size:12.5px;color:var(--tx2)}
.fz-it .q{font-weight:600;font-variant-numeric:tabular-nums}.fz-it .q.low{color:var(--low)}
.fz-note{font-size:12.5px;color:var(--tx3);margin-top:6px}
.fz-draft{margin-top:10px;max-width:480px;border-radius:16px;box-shadow:inset 0 0 0 1px var(--line2);padding:14px}
.fz-draft .hd{font-size:12.5px;color:var(--tx3);display:flex;justify-content:space-between}
.fz-kv{display:grid;grid-template-columns:100px 1fr;gap:6px 12px;font-size:14px;margin-top:10px}
.fz-kv span{color:var(--tx2)}
.fz-acts{display:flex;gap:8px;margin-top:12px}
.fz-acts button{height:36px;padding:0 14px;border-radius:18px;font:inherit;font-size:14px;font-weight:500;border:0;cursor:pointer}
.fz-acts .p{background:var(--pri);color:var(--onpri)}.fz-acts .s{background:none;color:var(--tx);box-shadow:inset 0 0 0 1px var(--line2)}
.fz-sheet{margin-top:10px;max-width:520px;border-radius:14px;box-shadow:inset 0 0 0 1px var(--line);overflow:hidden;font-size:12.5px}
.fz-sheet .r{display:grid;grid-template-columns:1fr 1.6fr .5fr 1fr;border-top:1px solid var(--line);animation:fzin .35s both}
.fz-sheet .r:first-child{border-top:0;background:var(--soft);font-weight:600;color:var(--tx2)}
.fz-sheet span{padding:7px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fz-scan{position:relative;margin-top:10px;max-width:400px;height:220px;border-radius:16px;background:center/cover;overflow:hidden}
.fz-scan .sw{position:absolute;left:0;right:0;height:80px;top:-80px;background:linear-gradient(180deg,transparent,rgba(255,255,255,.12) 70%,rgba(255,255,255,.6) 98%,transparent);animation:fzsw 1.8s ease-in-out infinite}
@keyframes fzsw{to{top:100%}}
.fz-scan .bx{position:absolute;border:1.5px solid rgba(255,255,255,.9);border-radius:9px;opacity:0;transform:scale(1.06);transition:all .45s cubic-bezier(.32,.72,0,1)}
.fz-scan .bx.on{opacity:1;transform:none}
.fz-scan .bx b{position:absolute;left:-1px;top:-1px;font-size:10.5px;background:#fff;color:#000;padding:0 5px;border-radius:8px 0 6px 0}
.fz-cf{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--tx2);margin-left:6px}
.fz-cf i{width:6px;height:6px;border-radius:50%;background:#34C759}.fz-cf.l i{background:#E3B45C}.fz-cf.n i{background:#8E8E93}
@media (max-width:600px){.fz-chips{justify-content:flex-start;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}.fz-chips::-webkit-scrollbar{display:none}}
@media (prefers-reduced-motion:reduce){.fz *{animation:none!important;transition:none!important}}
</style>
<script>
const FZ_IMG=/*IMG*/{};const FZ_WASH=/*WASH*/'';
const FZ_MARK=s=>`<svg width="${s}" height="${s}" viewBox="10 10 80 80" style="fill:currentColor;stroke:none"><path d="M12 24A12 12 0 0 1 24 12L40.5 12A5 5 0 0 1 45.5 17L45.5 38.5A4.5 4.5 0 0 0 50 43A4.5 4.5 0 0 0 54.5 38.5L54.5 17A5 5 0 0 1 59.5 12L76 12A12 12 0 0 1 88 24L88 40.5A5 5 0 0 1 83 45.5L61.5 45.5A4.5 4.5 0 0 0 57 50A4.5 4.5 0 0 0 61.5 54.5L83 54.5A5 5 0 0 1 88 59.5L88 76A12 12 0 0 1 76 88L59.5 88A5 5 0 0 1 54.5 83L54.5 61.5A4.5 4.5 0 0 0 50 57A4.5 4.5 0 0 0 45.5 61.5L45.5 83A5 5 0 0 1 40.5 88L24 88A12 12 0 0 1 12 76L12 59.5A5 5 0 0 1 17 54.5L38.5 54.5A4.5 4.5 0 0 0 43 50A4.5 4.5 0 0 0 38.5 45.5L17 45.5A5 5 0 0 1 12 40.5Z"/></svg>`;
const FZ_IC={send:'<path d="M12 19V5M6 11l6-6 6 6"/>',plus:'<path d="M12 5v14M5 12h14"/>',sheet:'<rect x="4" y="4" width="16" height="16" rx="2.5"/><path d="M4 10h16M10 4v16"/>',cam:'<path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2"/><circle cx="12" cy="12" r="3.2"/>',ck:'<path d="M20 6 9 17l-5-5"/>',box:'<path d="M3 7.5 12 3l9 4.5v9L12 21l-9-4.5Z"/><path d="M3 7.5 12 12l9-4.5M12 12v9"/>',arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>'};
const fzic=n=>`<svg class="i" viewBox="0 0 24 24">${FZ_IC[n]}</svg>`;
const FZ_ITEMS=[{n:'M3 x 10mm screws',q:120,loc:'Drawer 2, Robotics bench',img:'p5',low:20},{n:'M3 nuts',q:80,loc:'Drawer 2, Robotics bench',img:'p0',low:20},{n:'M5 x 20 screws',q:25,loc:'Fastener bin B',img:'p6',low:10},{n:'goBILDA 5203 motors',q:3,loc:'Parts cabinet, shelf 1',low:4},{n:'REV servo hubs',q:1,loc:'Electronics tote',low:2},{n:'USB-C cables',q:6,loc:'Electronics tote',low:2},{n:'8mm REX shaft, 300mm',q:4,loc:'Long parts rack',low:2},{n:'Spare battery packs',q:2,loc:'Charging shelf',low:3}];
const FZ_SHEET=[['Part #','Description','Qty','Location'],['PN-F91','M3 washer','150','Drawer 2'],['PN-F111','M5x20 screw','25','Fastener bin B'],['PN-F78','M3x6mm set screw','50','Drawer 4'],['PN-F213','Extension spring 1/4 in','4','Parts cabinet']];
function FZChat(root,opt={}){
 const items=JSON.parse(JSON.stringify(opt.items||FZ_ITEMS));const SHEET=opt.sheet||FZ_SHEET;const asks=opt.asks||['Where are the M3 screws?','What is running low?','Do we have any servo hubs?'];
 root.classList.add('fz');if(opt.h)root.style.setProperty('--fzh',opt.h+'px');
 root.innerHTML=`<div class="fz-thread"></div><div class="fz-box"><button class="fz-b" aria-label="Add">${fzic('plus')}</button><textarea rows="1" placeholder="${opt.ph||'Ask about your inventory...'}"></textarea><button class="fz-b go" disabled aria-label="Send">${fzic('send')}</button></div>
 <div class="fz-pm"><button data-k="imp">${fzic('sheet')}Import a spreadsheet</button><button data-k="scan">${fzic('cam')}Capture with a photo</button></div>
 <div class="fz-chips">${asks.map(a=>`<button class="fz-chip">${a}</button>`).join('')}</div>`;
 const th=root.querySelector('.fz-thread'),ta=root.querySelector('textarea'),go=root.querySelector('.go');
 const esc=s=>s.replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));
 const scroll=()=>{th.scrollTop=th.scrollHeight};
 const add=h=>{root.classList.add('open');opt.onOpen&&opt.onOpen();const d=document.createElement('div');d.innerHTML=h;const e=d.firstElementChild;th.appendChild(e);scroll();return e};
 const bot=(f,ms=650)=>{const a=add(`<div class="fz-a"><span class="m">${FZ_MARK(15)}</span><div class="b"><span class="fz-dots"><i></i><i></i><i></i></span></div></div>`);setTimeout(()=>{a.querySelector('.b').innerHTML=f();scroll();a._after&&a._after()},ms);return a};
 const row=x=>`<div class="fz-it"><span class="t" ${x.img?`style="background-image:url(${FZ_IMG[x.img]})"`:''}>${x.img?'':fzic('box')}</span><div class="tx"><b>${esc(x.n)}</b><small>${esc(x.loc)}</small></div><span class="q ${x.q<=x.low?'low':''}">${x.q}</span></div>`;
 const STOP=new Set('where are is the do we i have any how many much what my our a an of in to for did put there some can you find show me running low on am need needs restocking restock left'.split(' '));
 const words=s=>s.toLowerCase().replace(/[^a-z0-9 ]/g,' ').split(/\s+/).filter(w=>w&&!STOP.has(w)).map(w=>w.replace(/s$/,''));
 function ask(t){add(`<div class="fz-u"><div>${esc(t)}</div></div>`);const l=t.toLowerCase();
  if(/^(add|we have|i have|put)\b/.test(l)){bot(()=>draft(t));return}
  if(/low|restock|running out/.test(l)){bot(()=>{const L=items.filter(x=>x.q<=x.low);return `<b>${L.length} items</b> are at or below the low level you set:<div class="fz-items">${L.map(row).join('')}</div>`});return}
  const ws=words(t);const m=items.map(x=>({x,s:ws.filter(w=>x.n.toLowerCase().includes(w)).length})).filter(o=>o.s).sort((a,b)=>b.s-a.s).map(o=>o.x);
  bot(()=>{if(!m.length)return "I can't find that in this inventory. FindEZ answers from what's recorded, so describe it or capture it with a photo to add it.";const x=m[0];
   return (/how many|how much/.test(l)?`You have <b>${x.q}</b> ${esc(x.n)}, recorded in <b>${esc(x.loc)}</b>.`:`<b>${esc(x.n)}</b> ${x.q===1?'is':'are'} recorded in <b>${esc(x.loc)}</b>. You have ${x.q}.`)+`<div class="fz-items">${m.slice(0,3).map(row).join('')}</div>`})}
 function draft(t){const m=t.match(/(\d+)/);const n=m?+m[1]:1;let r=t.replace(/^(add|we have|i have|put)\s+/i,'').replace(/^\d+\s*/,'').replace(/^(a|an)\s+/i,'');let loc='Not set';const lm=r.match(/\s(?:to|in|into|on)\s+(?:the\s+)?(.+)$/i);if(lm){loc=lm[1].replace(/^\w/,c=>c.toUpperCase());r=r.slice(0,lm.index)}const name=r.trim().replace(/^\w/,c=>c.toUpperCase())||'New item';const id='fd'+Math.random().toString(36).slice(2);
  setTimeout(()=>{const d=document.getElementById(id);if(!d)return;d.querySelector('.p').onclick=()=>{items.unshift({n:name,q:n,loc,low:0});d.querySelector('.fz-acts').innerHTML=`<span style="font-size:13.5px;color:var(--tx2);display:flex;gap:6px;align-items:center">${fzic('ck')}Saved</span>`};d.querySelector('.s').onclick=()=>{d.querySelector('.fz-acts').innerHTML='<span style="font-size:13.5px;color:var(--tx3)">Discarded. Nothing was saved.</span>'}},50);
  return `Here's what I'll add. Check it before saving:<div class="fz-draft" id="${id}"><div class="hd"><span>New item</span><span>Not saved yet</span></div><div class="fz-kv"><span>Name</span><b>${esc(name)}</b><span>Quantity</span><b>${n}</b><span>Location</span><b>${esc(loc)}</b></div><div class="fz-acts"><button class="p">Save</button><button class="s">Discard</button></div></div>`}
 function imp(){root.classList.remove('pmon');add(`<div class="fz-u"><div>inventory.xlsx</div></div>`);const a=bot(()=>`Reading your spreadsheet. Your column names stay exactly as they are:<div class="fz-sheet">${SHEET.map((r,i)=>`<div class="r" style="animation-delay:${i*.15}s">${r.map(c=>`<span>${c}</span>`).join('')}</div>`).join('')}</div><div class="fz-note" data-n>Found ${SHEET.length-1} rows...</div>`);
  a._after=()=>setTimeout(()=>{const n=a.querySelector('[data-n]');n.innerHTML=`${SHEET.length-1} items ready to review. Nothing is saved until you approve.`;SHEET.slice(1).forEach(r=>items.push({n:r[1],q:+r[2],loc:r[3],low:0}));scroll()},1100)}
 function scan(){root.classList.remove('pmon');add(`<div class="fz-u"><div>Photo of a parts bin</div></div>`);const a=bot(()=>`Looking at your photo...<div class="fz-scan" style="background-image:url(${FZ_WASH})"><span class="sw"></span><span class="bx" style="left:40%;top:56%;width:22%;height:26%"><b>1</b></span><span class="bx" style="left:53%;top:26%;width:20%;height:24%"><b>2</b></span><span class="bx" style="left:24%;top:30%;width:16%;height:22%"><b>3</b></span></div><div data-r></div>`,500);
  a._after=()=>{a.querySelectorAll('.bx').forEach((b,i)=>setTimeout(()=>b.classList.add('on'),300+i*400));setTimeout(()=>{const s=a.querySelector('.sw');s&&s.remove();a.querySelector('[data-r]').innerHTML=`<div style="margin-top:10px">Here's what I found, most confident first:</div><div class="fz-items"><div class="fz-it"><span class="t" style="background:url(${FZ_WASH}) 52% 70%/420%"></span><div class="tx"><b>Flat washers, steel</b><small>Round washers<span class="fz-cf"><i></i>Confident</span></small></div><span class="q">1 bin</span></div><div class="fz-it"><span class="t" style="background:url(${FZ_WASH}) 66% 34%/420%"></span><div class="tx"><b>Spring washers, M8</b><small>Split lock washers<span class="fz-cf l"><i></i>Likely</span></small></div><span class="q">1 bin</span></div><div class="fz-it" style="opacity:.7"><span class="t" style="background:url(${FZ_WASH}) 28% 38%/420%"></span><div class="tx"><b>Unknown item</b><small>Partly hidden<span class="fz-cf n"><i></i>Not sure</span></small></div><span class="q">?</span></div></div><div class="fz-note">You confirm names, sizes and counts before anything is saved.</div>`;scroll()},1800)}}
 ta.oninput=()=>{ta.style.height='auto';ta.style.height=Math.min(ta.scrollHeight,120)+'px';go.disabled=!ta.value.trim()};
 const send=()=>{const v=ta.value.trim();if(!v)return;ta.value='';ta.oninput();ask(v)};
 ta.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}};go.onclick=send;
 root.querySelector('.fz-b').onclick=e=>{e.stopPropagation();root.classList.toggle('pmon')};
 document.addEventListener('click',()=>root.classList.remove('pmon'));
 root.querySelector('[data-k=imp]').onclick=imp;root.querySelector('[data-k=scan]').onclick=scan;
 root.querySelectorAll('.fz-chip').forEach(c=>c.onclick=()=>ask(c.textContent));
 return {ask}}
</script>
