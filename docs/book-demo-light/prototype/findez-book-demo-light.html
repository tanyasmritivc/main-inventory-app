.cz-input:hover{border-color:#D4D4DA}
.cz-input:focus{outline:none;background:#FFFFFF;border-color:#0A0A0B;box-shadow:0 0 0 3px rgba(10,10,11,.06)}
.cz-disp{font-family:'Inter Tight',Inter,sans-serif;font-weight:400;letter-spacing:-0.024em}
.cz-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.cz-chip{height:40px;padding:0 16px;border-radius:999px;font:inherit;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:border-color .15s,background .15s}
.cz-chip:hover{border-color:#0A0A0B !important}
.cz-btn{height:52px;padding:0 28px;border:0;border-radius:12px;background:#0A0A0B;color:#FFFFFF;font:inherit;font-size:16px;font-weight:500;cursor:pointer;transition:opacity .15s;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.cz-btn:hover{opacity:.88}
.cz-sq{width:52px;height:52px;border-radius:12px;border:1px solid #2A2A2A;background:#1B1B1B;display:grid;place-items:center;cursor:pointer;transition:border-color .15s}
.cz-sq:hover{border-color:#F3F1EA}
.cz-pill{height:44px;padding:0 14px;border-radius:12px;border:1px solid #E6E6EA;font:inherit;font-size:14px;font-weight:500;cursor:pointer;transition:background .15s,color .15s}
.cz button:focus-visible,.cz a:focus-visible{outline:2px solid #0A0A0B;outline-offset:2px}
@keyframes cz-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.cz-fade{animation:cz-in .45s ease-out both}
@media (prefers-reduced-motion: reduce){.cz-fade{animation:none}}
@media (max-width:1000px){.cz-main{grid-template-columns:1fr !important}.cz-right{border-left:0 !important;border-top:1px solid #E6E6EA}.cz-nav{display:none !important}.cz-fcols{grid-template-columns:1fr 1fr !important}}
@media (max-width:560px){.cz main{padding:20px 10px 64px !important}.cz-right{padding:40px 16px 32px !important}.cz-row{grid-template-columns:1fr}.cz-pad{padding:32px 22px !important}.cz-hide-sm{display:none !important}.cz-fcols{grid-template-columns:1fr !important}}
</style>

<main style="padding: 56px 32px 112px; background: #F7F7F8; color: #0A0A0B">
<div style="max-width: 1376px; margin: 0 auto; border: 1px solid #E6E6EA; border-radius: 24px; overflow: hidden; background: #FFFFFF">
<div class="cz-main" style="display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr)">

<section>
<div style="height: 100%; display: flex; flex-direction: column">
<div class="cz-pad" style="padding: 64px 56px 40px; border-bottom: 1px solid #E6E6EA">
<h1 class="cz-disp" style="margin: 0; font-size: clamp(42px, 4.4vw, 64px); line-height: 1.04">See FindEZ<br>in action.</h1>
<p style="margin: 22px 0 0; font-size: 17px; line-height: 1.6; color: #5E5F66; max-width: 480px">Curious how your team could find parts faster and check a build against what’s on the shelf? Tell us about your team and Tanya will be in touch.</p>
</div>

<sc-if value="{{isForm}}" hint-placeholder-val="{{true}}">
<div class="cz-pad" style="padding: 40px 56px 56px; display: flex; flex-direction: column; gap: 22px">
<div class="cz-row">
<label class="cz-label"><span>Full name<span class="cz-req">*</span></span><input class="cz-input" placeholder="Alex Chen" value="{{f.name}}" onChange="{{setName}}" autocomplete="name"></label>
<label class="cz-label"><span>Work email<span class="cz-req">*</span></span><input class="cz-input" type="email" placeholder="alex@yourteam.org" value="{{f.email}}" onChange="{{setEmail}}" autocomplete="email"></label>
</div>
<label class="cz-label"><span>Company or organization<span class="cz-req">*</span></span><input class="cz-input" placeholder="Your team, lab or company" value="{{f.company}}" onChange="{{setCompany}}" autocomplete="organization"></label>
<fieldset style="border: 0; margin: 0; padding: 0">
<legend style="font-size: 14px; font-weight: 500; padding: 0 0 12px; color: #0A0A0B">What would you like to explore? <span class="cz-opt">(optional)</span></legend>
<div style="display: flex; flex-wrap: wrap; gap: 10px">
<sc-for list="{{chips}}" as="c" hint-placeholder-count="4">
<button class="cz-chip" type="button" aria-pressed="{{c.on}}" onClick="{{c.toggle}}" style="border: 1px solid {{c.border}}; background: {{c.bg}}; color: {{c.fg}}">{{c.label}}<span aria-hidden="true" style="font-size: 16px; line-height: 1">{{c.mark}}</span></button>
</sc-for>
</div>
</fieldset>
<sc-if value="{{showErr}}" hint-placeholder-val="{{false}}">
<div role="alert" style="font-size: 14px; color: #B42318">{{err}}</div>
</sc-if>
<div><button class="cz-btn" type="button" onClick="{{submit}}">Request a demo <span aria-hidden="true">→</span></button></div>
</div>
</sc-if>

<sc-if value="{{isDone}}" hint-placeholder-val="{{false}}">
<div class="cz-pad cz-fade" style="padding: 48px 52px 56px; display: flex; flex-direction: column; gap: 18px">
<span style="width: 48px; height: 48px; border-radius: 14px; background: #0A0A0B; color: #FFFFFF; display: grid; place-items: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"></path></svg></span>
<div class="cz-disp" style="font-size: 34px; line-height: 1.1">Thanks, {{firstName}}.</div>
<div style="font-size: 18px; line-height: 1.55; color: #5E5F66; max-width: 520px">Tanya will be in touch at {{f.email}} to arrange a walkthrough.</div>
<div><a href="#" class="cz-btn" style="background: #F2F3F5; color: #0A0A0B">Back to findez.ai</a></div>
</div>
</sc-if>
</div>
</section>

<section class="cz-right" aria-label="How teams use FindEZ" style="background: #F2F3F5; border-left: 1px solid #E6E6EA; display: flex; flex-direction: column; align-items: center; padding: 56px 40px 40px">
<div style="width: 100%; max-width: 520px; flex: 1; display: flex; flex-direction: column">
<div class="cz-disp" style="text-align: center; font-size: 26px; line-height: 1.2">How teams like yours use FindEZ</div>

<div style="margin-top: 28px; position: relative; flex: 1; display: flex; flex-direction: column">
<article style="background: #FFFFFF; border: 1px solid #E6E6EA; border-radius: 24px; overflow: hidden; display: flex; flex-direction: column; flex: 1">
<div style="display: flex; align-items: center; gap: 16px; padding: 22px 26px; border-bottom: 1px solid #ECECEF">
<span class="cz-disp" style="font-size: 48px; line-height: 1; font-variant-numeric: tabular-nums">{{s.stat}}</span>
<span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 12px; letter-spacing: .06em; line-height: 1.45; text-transform: uppercase; color: #5E5F66">{{s.statLabel}}</span>
</div>
<div style="padding: 26px 32px 24px; text-align: center">

<div class="cz-disp" style="margin-top: 10px; font-size: 22px; line-height: 1.35">{{s.q}}</div>
<div style="margin-top: 10px; font-size: 15px; line-height: 1.5; color: #5E5F66">{{s.a}}</div>
</div>
<div style="position: relative; flex: 1; min-height: 260px; background: {{s.bg}}; overflow: hidden">

</sc-if>
<sc-if value="{{s.isBolt}}" hint-placeholder-val="{{false}}">
<svg class="cz-fade" viewBox="-180 -140 360 280" style="position: absolute; inset: 0; width: 100%; height: 100%" aria-hidden="true" fill="none" stroke="{{s.stroke}}" stroke-width="1.6" vector-effect="non-scaling-stroke">
<g transform="rotate(-24)">
<polygon points="-120,-46 -120,46 -90,62 -60,46 -60,-46 -90,-62"></polygon><line x1="-90" y1="-62" x2="-90" y2="62" opacity=".5"></line>
<rect x="-60" y="-26" width="200" height="52"></rect>

<line x1="-170" y1="0" x2="170" y2="0" stroke-dasharray="6 6" opacity=".2"></line>
</g>
</svg>
</sc-if>
</div>
</article>
</div>

<div style="margin-top: 24px; display: flex; justify-content: center">
<div style="display: flex; gap: 6px; flex-wrap: wrap" role="tablist" aria-label="Team type">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="4">
<button class="cz-pill" type="button" role="tab" aria-selected="{{t.on}}" onClick="{{t.pick}}" style="background: {{t.bg}}; color: {{t.fg}}">{{t.label}}</button>
</sc-for>
</div>

</div>
</div>
</section>
</div>
</div>

<script>
/* Tiny template runtime for this prototype only. Do not ship it: port the markup, CSS and the Component logic into React. */
class DCLogic{setState(p){this.state={...this.state,...p};schedule()}}

class Component extends DCLogic {
  state = { step: 'form', f: { name: '', email: '', company: '' }, picked: [], err: '', i: 0 };
  start() { if (this._t) clearInterval(this._t); this._t = setInterval(() => { if (typeof document !== 'undefined' && document.hidden) return; this.setState({ i: (this.state.i + 1) % 4 }); }, 4000); }
  componentDidMount() { this.start(); }
  componentWillUnmount() { clearInterval(this._t); this._t = null; }
  go(n) { this.setState({ i: (n + 4) % 4 }); this.start(); }
  setF(k, v) { this.setState({ f: { ...this.state.f, [k]: v }, err: '' }); }
  renderVals() {
    if (!this._t && typeof window !== 'undefined') this.start();
    const s = this.state;
    const SLIDES = [
      { tab: 'Robotics', who: 'A robotics team', stat: '22', statLabel: '8mm bearings<br>Pit cart, Bin A1', q: '“Where are the 8mm bearings?”', a: 'Recorded in Pit cart, Bin A1. You have 22.', bg: '#F4CFD6', stroke: '#0A0A0B', tagColor: 'rgba(10,10,11,.55)', kind: 'bearing' },
      { tab: 'Hardware', who: 'A hardware startup', stat: '7/8', statLabel: 'Parts ready<br>for the rev C build', q: '“Can we build rev C with what we have?”', a: '7 of 8 parts are on hand. 6 M3 standoffs are short.', bg: '#5C1A27', stroke: '#F4CFD6', tagColor: 'rgba(244,207,214,.7)', kind: 'gear' },
      { tab: 'Labs', who: 'A research lab', stat: '6', statLabel: 'Multimeters<br>Electronics wall', q: '“Where are the multimeters?”', a: 'Recorded on the Electronics wall. There are 6.', bg: '#E4E6EA', stroke: '#0A0A0B', tagColor: 'rgba(10,10,11,.5)', kind: 'pulley' },
      { tab: 'Workshops', who: 'A workshop', stat: '2', statLabel: 'Spare drive belts<br>Maintenance cabinet', q: '“Do we have spare belts for the CNC?”', a: 'Recorded in the Maintenance cabinet, Shelf 3.', bg: 'radial-gradient(70% 90% at 0% 0%, rgba(255,181,71,.9), rgba(255,181,71,0) 60%), radial-gradient(70% 90% at 100% 100%, rgba(111,184,255,.85), rgba(111,184,255,0) 62%), #0A0A0B', stroke: '#FFFFFF', tagColor: 'rgba(255,255,255,.65)', kind: 'bolt' }
    ];
    const cur = SLIDES[s.i];
    const CH = ['AI inventory search', 'Robotics inventory', 'Fusion and STEP models', 'BOM comparison'];
    const f = s.f;
    return {
      isForm: s.step === 'form', isDone: s.step === 'done', f,
      firstName: (f.name || 'there').trim().split(' ')[0],
      setName: (e) => this.setF('name', e.target.value),
      setEmail: (e) => this.setF('email', e.target.value),
      setCompany: (e) => this.setF('company', e.target.value),
      chips: CH.map(l => { const on = s.picked.indexOf(l) >= 0; return { label: l, on: on ? 'true' : 'false', mark: on ? '✓' : '+', bg: on ? '#0A0A0B' : '#FFFFFF', fg: on ? '#FFFFFF' : '#0A0A0B', border: on ? '#0A0A0B' : '#E6E6EA', toggle: () => this.setState({ picked: on ? s.picked.filter(x => x !== l) : s.picked.concat([l]) }) }; }),
      showErr: !!s.err, err: s.err,
      submit: () => {
        const v = this.state.f;
        if (!v.name || !v.email || !v.company) { this.setState({ err: 'Please fill in your name, work email and organization.' }); return; }
        if (v.email.indexOf('@') < 1) { this.setState({ err: 'Please enter a valid work email.' }); return; }
        this.setState({ step: 'done', err: '' });
      },
      s: { ...cur, statLabel: cur.statLabel.split('<br>').join(' · '), isBearing: cur.kind === 'bearing', isGear: cur.kind === 'gear', isPulley: cur.kind === 'pulley', isBolt: cur.kind === 'bolt' },
      tabs: SLIDES.map((x, k) => ({ label: x.tab, on: k === s.i ? 'true' : 'false', bg: k === s.i ? '#0A0A0B' : '#FFFFFF', fg: k === s.i ? '#FFFFFF' : '#5E5F66', pick: () => this.go(k) })),
      prev: () => this.go(s.i - 1),
      next: () => this.go(s.i + 1)
    };
  }
}

const C=new Component();
const get=(sc,p)=>p.split('.').reduce((o,k)=>o==null?o:o[k],sc);
function sub(str,sc){const m=str.match(/^\{\{([^}]+)\}\}$/);if(m)return get(sc,m[1].trim());return str.replace(/\{\{([^}]+)\}\}/g,(_,p)=>{const v=get(sc,p.trim());return v==null?'':v})}
function proc(node,sc,out){
 if(node.nodeType===3){out.appendChild(document.createTextNode(sub(node.textContent,sc)));return}
 if(node.nodeType!==1)return;
 const tag=node.tagName.toLowerCase();
 if(tag==='sc-for'){const L=sub(node.getAttribute('list'),sc)||[];const as=node.getAttribute('as');L.forEach(it=>{const s2=Object.create(sc);s2[as]=it;node.childNodes.forEach(c=>proc(c,s2,out))});return}
 if(tag==='sc-if'){if(sub(node.getAttribute('value'),sc))node.childNodes.forEach(c=>proc(c,sc,out));return}
 const svg='http://www.w3.org/2000/svg';
 const el=(tag==='svg'||out.namespaceURI===svg)?document.createElementNS(svg,tag):document.createElement(tag);
 for(const a of node.attributes){const v=sub(a.value,sc);
  if(/^on/i.test(a.name)){if(typeof v==='function'){let ev=a.name.slice(2).toLowerCase();if(ev==='change'&&tag==='input')ev='input';el.addEventListener(ev,v)}continue}
  if(a.name==='disabled'){if(v===true||v==='true')el.setAttribute('disabled','');continue}
  if(a.name==='value'){el._v=v;continue}
  el.setAttribute(a.name,v)}
 node.childNodes.forEach(c=>proc(c,sc,el));if(el._v!==undefined)el.value=el._v;out.appendChild(el)}
const T=document.createElement('template');T.innerHTML=document.getElementById('tpl').textContent;
const root=document.getElementById('root');
function path(n){const p=[];while(n&&n!==root){p.unshift([...n.parentNode.children].indexOf(n));n=n.parentNode}return p}
function at(p){let n=root;for(const i of p){n=n&&n.children[i]}return n}
let q=false;function schedule(){if(!q){q=true;requestAnimationFrame(()=>{q=false;render()})}}
function render(){const a=document.activeElement;let fp=null,ss=null,se=null;if(a&&root.contains(a)&&a!==document.body){fp=path(a);try{ss=a.selectionStart;se=a.selectionEnd}catch(e){}}
 const frag=document.createDocumentFragment();const sc=C.renderVals();T.content.childNodes.forEach(c=>proc(c,sc,frag));root.replaceChildren(frag);
 if(fp){const n=at(fp);if(n){n.focus({preventScroll:true});try{if(ss!=null)n.setSelectionRange(ss,se)}catch(e){}}}}
window.C=C;render();if(C.componentDidMount)C.componentDidMount();</script>
