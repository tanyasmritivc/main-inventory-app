<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FindEZ Onboarding</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>

:root{--ink:#111112;--or:#E8590C;--orink:#C2410C;--ortint:#FFE8DA;--blue:#A9D6F5;--tint:#EEF6FD;--mut:#6B6C72;--line:#ECEDF0;--page:#EEF1F5}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--page);font-family:'Plus Jakarta Sans',J,system-ui,sans-serif;color:var(--ink);min-height:100dvh;display:flex;flex-direction:column;align-items:center}
.mono{font-family:'Geist Mono',M,ui-monospace,monospace;letter-spacing:0}
.hdr{display:flex;align-items:center;gap:14px;padding:22px 16px 14px;max-width:420px;width:100%;justify-content:space-between}
.hdr b{font-size:15px;font-weight:600;letter-spacing:-.02em} .hdr span{color:var(--mut);font-size:13px}
.hdr button{font:inherit;font-size:13px;font-weight:600;border:1px solid #D9DCE1;background:#fff;border-radius:999px;padding:8px 14px;cursor:pointer}
#phone{position:relative;width:390px;height:844px;border-radius:52px;overflow:hidden;overflow:clip;margin-bottom:40px;
 background:radial-gradient(90% 45% at 50% 20%,#FFEDE2 0%,rgba(255,237,226,0) 70%),linear-gradient(180deg,#FFF8F3 0%,#FFFFFF 55%);box-shadow:0 0 0 10px #0B0B0D,0 30px 80px rgba(20,40,70,.25)}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block}
.sb{position:absolute;top:0;left:0;right:0;height:50px;display:flex;justify-content:space-between;align-items:center;padding:6px 30px 0 40px;font-weight:600;font-size:16px;z-index:20;pointer-events:none}
.isl{position:absolute;left:50%;top:11px;width:122px;height:35px;margin-left:-61px;border-radius:20px;background:#000;z-index:21}
.nav{position:absolute;top:54px;left:16px;right:16px;display:flex;align-items:center;justify-content:center;z-index:15;height:36px}
#dots{display:flex;gap:6px} #dots i{width:22px;height:4px;border-radius:4px;background:rgba(17,17,18,.12);transition:background .4s,width .4s}
#dots i.on{background:var(--ink);width:30px}
#back{position:absolute;left:0;width:36px;height:36px;border-radius:50%;border:0;background:rgba(255,255,255,.8);display:grid;place-items:center;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .3s;box-shadow:0 0 0 1px var(--line)}
.chat #back{opacity:1;pointer-events:auto}
/* intro */
#intro{position:absolute;left:0;right:0;bottom:0;padding:0 22px 30px;z-index:10;transition:transform .6s cubic-bezier(.2,.8,.2,1),opacity .4s}
.chat #intro{transform:translateY(40px);opacity:0;pointer-events:none}
#intro h1{margin:0;font-size:36px;font-weight:600;letter-spacing:-.045em;line-height:1.05}
#intro h1 em{font-style:normal;background:linear-gradient(180deg,transparent 64%,#FFD3B8 64%,#FFD3B8 92%,transparent 92%)}
#intro p{margin:10px 0 18px;color:var(--mut);font-size:15.5px}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;font:inherit;background:#fff;border:1px solid var(--line);border-radius:20px;padding:14px 16px;margin-bottom:10px;cursor:pointer;
 box-shadow:0 8px 24px rgba(30,60,100,.06);transition:transform .15s,box-shadow .2s;animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
.opt:nth-of-type(2){animation-delay:.06s} .opt:nth-of-type(3){animation-delay:.12s}
.opt:active{transform:scale(.98)} .opt:hover{box-shadow:0 12px 30px rgba(30,60,100,.12)}
.opt .ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;flex:none;background:var(--tint)}
.opt.cam .ic{background:var(--or)} .opt b{display:block;font-weight:600;font-size:16px;letter-spacing:-.02em} .opt small{color:var(--mut);font-size:13px}
.opt .ar{margin-left:auto;color:#B4B6BC}
#have{display:block;margin:14px auto 0;background:none;border:0;font:inherit;font-size:14px;color:var(--mut);cursor:pointer} #have b{color:var(--ink);font-weight:600}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
.sample{position:relative;display:block;width:100%;padding:0;border:0;border-radius:24px;overflow:hidden;cursor:pointer;aspect-ratio:1100/560;background:#ddd;
 box-shadow:0 16px 40px rgba(120,60,20,.16),0 0 0 1px rgba(17,17,18,.06);animation:rise .6s cubic-bezier(.2,.8,.2,1) both;transition:transform .15s}
.sample:active{transform:scale(.985)}
.sample img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.sample::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 45%,rgba(0,0,0,.62) 100%)}
.sample .br{position:absolute;inset:14px 14px 58px;z-index:1;animation:breath 2.4s ease-in-out infinite}
.sample .br i{position:absolute;width:22px;height:22px;border:2.5px solid #fff}
.sample .br i:nth-child(1){left:0;top:0;border-right:0;border-bottom:0;border-radius:9px 0 0 0}.sample .br i:nth-child(2){right:0;top:0;border-left:0;border-bottom:0;border-radius:0 9px 0 0}
.sample .br i:nth-child(3){left:0;bottom:0;border-right:0;border-top:0;border-radius:0 0 0 9px}.sample .br i:nth-child(4){right:0;bottom:0;border-left:0;border-top:0;border-radius:0 0 9px 0}
@keyframes breath{50%{inset:18px 18px 62px;opacity:.75}}
.sample .tease{position:absolute;left:0;right:0;top:0;height:46px;z-index:1;background:linear-gradient(180deg,rgba(232,89,12,0),rgba(232,89,12,.28) 85%,#FF8A4C 100%);mix-blend-mode:screen;animation:tease 3.2s cubic-bezier(.5,0,.5,1) infinite}
@keyframes tease{0%{transform:translateY(-50px);opacity:0}10%{opacity:1}55%{transform:translateY(150px);opacity:1}65%,100%{transform:translateY(150px);opacity:0}}
.sample .cap{position:absolute;left:16px;bottom:13px;z-index:2;text-align:left;color:#fff}
.sample .cap small{display:block;font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;opacity:.8}
.sample .cap b{font-size:16px;font-weight:600;letter-spacing:-.02em}
.sample .go{position:absolute;right:12px;bottom:11px;z-index:2;display:flex;align-items:center;gap:7px;background:var(--or);color:#fff;font:inherit;font-weight:600;font-size:14.5px;padding:9px 14px 9px 11px;border-radius:999px;box-shadow:0 6px 18px rgba(232,89,12,.45);animation:glowo 1.8s ease-in-out infinite}
@keyframes glowo{50%{box-shadow:0 0 0 7px rgba(232,89,12,.22),0 6px 18px rgba(232,89,12,.45)}}
.alt{display:flex;align-items:center;gap:8px;margin-top:12px;animation:rise .6s .08s cubic-bezier(.2,.8,.2,1) both}
.alt span{color:var(--mut);font-size:13.5px;margin-right:2px}
.alt button{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap;font:inherit;font-size:14px;font-weight:600;background:#fff;border:1px solid var(--line);border-radius:999px;padding:10px 8px;cursor:pointer;box-shadow:0 4px 14px rgba(30,60,100,.05)}
.alt button:active{transform:scale(.97)}
/* chat */
#chatv{position:absolute;left:0;right:0;top:300px;bottom:0;z-index:10;display:flex;flex-direction:column;background:linear-gradient(180deg,rgba(255,255,255,0) 0,#fff 26px);transform:translateY(100%);transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.chat #chatv{transform:none}
#msgs{flex:1;overflow-y:auto;padding:24px 16px 8px;display:flex;flex-direction:column;gap:10px;scrollbar-width:none}
#msgs::-webkit-scrollbar{display:none}
.m{max-width:86%;font-size:15px;line-height:1.45;opacity:0;transform:translateY(10px);transition:opacity .3s,transform .35s cubic-bezier(.2,.8,.2,1)}
.m.in{opacity:1;transform:none}
.m.u{align-self:flex-end;background:var(--ink);color:#fff;padding:10px 14px;border-radius:20px 20px 6px 20px}
.m.a{align-self:flex-start;width:100%;max-width:100%}
.think{display:flex;align-items:center;gap:10px;color:var(--mut)} .think .pip{width:40px;height:40px;display:block;animation:bob .9s ease-in-out infinite;transform-origin:50% 90%} .pip svg{width:100%;height:100%}
.tt{background:linear-gradient(90deg,var(--mut) 0 40%,#C9CBD1 50%,var(--mut) 60% 100%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 1.4s linear infinite}
@keyframes sh{from{background-position:100% 0}to{background-position:-150% 0}}
@keyframes bob{0%,100%{transform:none}45%{transform:translateY(-5px) rotate(-2deg)}55%{transform:translateY(-5px) rotate(2deg)}}
.m.u.photo{padding:5px;border-radius:22px 22px 8px 22px}
.pic{position:relative;width:292px;aspect-ratio:1100/600;border-radius:17px 17px 5px 17px;overflow:hidden}
.pic::before{content:"";position:absolute;inset:0;background:rgba(10,10,12,.28);opacity:0;transition:opacity .3s;z-index:1}
.pic.scanning::before{opacity:1}
.beam{position:absolute;left:0;right:0;top:0;height:40%;z-index:2;opacity:0;pointer-events:none;
 background:linear-gradient(180deg,rgba(232,89,12,0) 0%,rgba(232,89,12,.30) 80%,rgba(255,170,120,.95) 97%,#fff 100%);transform:translateY(-100%)}
.pic.scanning .beam{opacity:1;animation:beam 1.5s cubic-bezier(.45,0,.55,1) forwards}
@keyframes beam{from{transform:translateY(-100%)}to{transform:translateY(250%)}}
.pic .tag{z-index:3}
.pic img{width:100%;height:100%;object-fit:cover;display:block}
.tag{position:absolute;border:2px solid var(--or);border-radius:6px;animation:pop .3s cubic-bezier(.2,.9,.3,1.3) both}
.tag.low i{top:2px;left:2px}
.tag i{position:absolute;left:-2px;top:-15px;font-style:normal;font-family:'Geist Mono',M,monospace;font-size:8px;background:var(--or);color:#fff;padding:1px 4px;border-radius:4px;white-space:nowrap}
@keyframes pop{from{opacity:0;transform:scale(1.2)}}
.inv{margin-top:10px;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:#fff;box-shadow:0 10px 26px rgba(30,60,100,.07)}
.ih{display:flex;justify-content:space-between;align-items:center;padding:11px 14px;border-bottom:1px solid var(--line);font-size:14px} .ih b{font-weight:600} .ih span{color:var(--mut);font-size:12.5px}
.row{display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid #F4F5F7;font-size:14px;opacity:0;transform:translateX(-8px);transition:opacity .25s,transform .3s}
.row.in{opacity:1;transform:none} .row:last-child{border-bottom:0}
.sw{width:14px;height:14px;border-radius:4px;flex:none;box-shadow:inset 0 0 0 1px rgba(17,17,18,.08)}
.nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .nm small{display:block;color:var(--mut);font-size:11px;margin-top:1px} .lc{color:var(--mut);font-size:12px;white-space:nowrap}
.q{min-width:34px;text-align:center;font-size:13px;padding:3px 6px;border-radius:8px;background:#F4F5F7;cursor:pointer}
.st{display:none;width:24px;height:24px;border-radius:8px;border:1px solid var(--line);background:#fff;font:inherit;cursor:pointer;line-height:1}
.row.edit .st{display:block} .row.edit .lc{display:none} .row.edit .q{background:var(--ortint);color:var(--orink)}
.loc{display:inline-flex;margin-top:8px;background:var(--ortint);color:var(--orink);font-weight:600;font-size:12.5px;padding:5px 11px;border-radius:999px}
.dock{padding:6px 12px 28px;background:#fff}
.sug{display:flex;gap:8px;overflow-x:auto;padding:4px 4px 10px;scrollbar-width:none} .sug::-webkit-scrollbar{display:none}
.chip{flex:none;font:inherit;font-size:14px;font-weight:500;border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 14px;cursor:pointer;opacity:0;transform:translateY(6px);transition:opacity .25s,transform .3s,background .2s}
.chip.in{opacity:1;transform:none} .chip:active{transform:scale(.96)}
.chip.hot{background:var(--ink);color:#fff;border-color:var(--ink);animation:glow 1.8s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 6px rgba(169,214,245,.6)}}
.comp{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:22px;padding:6px 6px 6px 14px;background:#fff}
#inp{flex:1;border:0;outline:0;font:inherit;font-size:15px;background:none;min-width:0;color:var(--ink)} #inp::placeholder{color:#9A9BA0}
#send{width:36px;height:36px;border-radius:12px;border:0;background:#E4E5E8;color:#fff;display:grid;place-items:center;cursor:pointer;transition:background .2s}
#send.on{background:var(--ink)}
/* auth */
#auth{position:absolute;left:0;right:0;bottom:0;z-index:25;background:#fff;border-radius:30px 30px 0 0;padding:26px 22px 34px;box-shadow:0 -20px 50px rgba(30,60,100,.12);transform:translateY(105%);transition:transform .65s cubic-bezier(.2,.8,.2,1)}
.auth #auth{transform:none}
.auth #chatv{transform:translateY(30%);opacity:.0;transition:transform .6s,opacity .4s}
#auth h2{margin:0;font-size:28px;font-weight:600;letter-spacing:-.04em} #auth p{margin:8px 0 20px;color:var(--mut);font-size:15px;line-height:1.4}
.ab{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;font:inherit;font-size:15.5px;font-weight:600;border-radius:16px;padding:15px;margin-bottom:10px;border:1px solid var(--line);background:#fff;cursor:pointer}
.ab.k{background:var(--ink);color:#fff;border-color:var(--ink)} .ab.done{background:var(--tint);border-color:var(--tint);color:var(--ink);font-weight:500;font-size:13.5px}
#more{display:block;margin:4px auto 0;background:none;border:0;font:inherit;font-size:14px;font-weight:600;color:var(--ink);cursor:pointer;padding:8px}
.fine{text-align:center;color:var(--mut);font-size:12.5px;margin-top:6px}
.home{position:absolute;bottom:8px;left:50%;width:130px;height:5px;margin-left:-65px;border-radius:3px;background:#111112;z-index:40}
@media (max-width:480px){.hdr{display:none} body{background:#fff} #phone{width:100vw;height:100dvh;border-radius:0;box-shadow:none;margin:0} .sb,.isl,.home{display:none} .nav{top:max(14px,env(safe-area-inset-top))}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important}}
</style>
