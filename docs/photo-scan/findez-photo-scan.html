:root{--bg:#000;--s1:#161618;--s2:#1B1B1E;--s3:#26262A;--line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.12);--tx:#F4F4F5;--tx2:#A1A1A6;--tx3:#6B6B70;--e:cubic-bezier(.32,.72,0,1)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#0A0A0B;font-family:Inter,-apple-system,system-ui,sans-serif;-webkit-font-smoothing:antialiased;color:var(--tx)}
body{display:flex;align-items:center;justify-content:center;gap:40px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.dev{width:390px;height:844px;border-radius:54px;background:var(--bg);position:relative;overflow:hidden;box-shadow:0 0 0 9px #1C1C1F,0 0 0 10px #333,0 40px 100px rgba(0,0,0,.6)}
@media (max-width:760px){body{display:block}.side{display:none!important}.dev{width:100vw;height:100dvh;border-radius:0;box-shadow:none}}
.sb{position:absolute;top:0;left:0;right:0;height:50px;display:flex;align-items:center;justify-content:space-between;padding:6px 34px 0 36px;font-weight:600;font-size:16.5px;z-index:9}
.top{position:absolute;top:52px;left:14px;right:14px;display:flex;align-items:center;gap:8px;z-index:8}
.cb{width:44px;height:44px;border-radius:50%;background:#141415;box-shadow:inset 0 0 0 1px var(--line2);display:grid;place-items:center}
.top .t{flex:1;text-align:center;font-weight:600;font-size:17px;padding-left:44px}
.top .bell{width:44px;height:44px;display:grid;place-items:center}
.msgs{position:absolute;inset:108px 0 150px;overflow-y:auto;padding:6px 16px 24px;scrollbar-width:none}
.msgs::-webkit-scrollbar{display:none}
/* scan card */
.card{border-radius:28px;background:linear-gradient(180deg,#161618,#121214);box-shadow:inset 0 1px 0 rgba(255,255,255,.045),0 0 0 1px rgba(255,255,255,.08);padding:8px;animation:in .5s var(--e) both}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
.stage{position:relative;height:300px;border-radius:22px;overflow:hidden;clip-path:inset(0 round 22px);-webkit-mask-image:-webkit-radial-gradient(white,black);isolation:isolate}
.stage .art{position:absolute;inset:0;z-index:0}
.stage .bgph{position:absolute;inset:-20%;background:center/cover;filter:blur(30px) saturate(0);opacity:.28;mix-blend-mode:luminosity;z-index:0}
.ph{position:absolute;top:14px;bottom:14px;left:50%;transform:translateX(-50%);aspect-ratio:527/701;background:center/cover;z-index:1;border-radius:14px;overflow:hidden;clip-path:inset(0 round 14px);box-shadow:0 18px 50px rgba(0,0,0,.45),0 0 0 1px rgba(255,255,255,.12)}
.riso{position:relative;overflow:hidden}
.grain::after,.grain::before{content:"";position:absolute;inset:0;pointer-events:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.95' numOctaves='3' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='220' height='220' filter='url(%23n)'/></svg>")}
.grain::after{background-size:180px;mix-blend-mode:overlay;opacity:.95}
.grain::before{background-size:120px;mix-blend-mode:soft-light;opacity:.8}
.rp-plum{background:radial-gradient(50% 60% at 12% 70%,#453349 0%,transparent 75%),radial-gradient(55% 55% at 55% 60%,#773F42 0%,transparent 72%),radial-gradient(40% 45% at 92% 10%,#996050 0%,transparent 72%),radial-gradient(35% 35% at 25% 5%,#B69D9F 0%,transparent 70%),linear-gradient(150deg,#453349,#773F42 55%,#996050)}
.rp-blue{background:radial-gradient(45% 55% at 12% 8%,#97A6B1 0%,transparent 72%),radial-gradient(40% 45% at 62% 18%,#748193 0%,transparent 72%),radial-gradient(60% 70% at 30% 75%,#4B556F 0%,transparent 75%),radial-gradient(70% 80% at 85% 90%,#222236 0%,transparent 72%),linear-gradient(155deg,#748193,#4B556F 45%,#222236 85%)}
.rp-terra{background:radial-gradient(55% 70% at 15% 40%,#AB5D44 0%,transparent 72%),radial-gradient(45% 55% at 58% 42%,#AC7A52 0%,transparent 72%),radial-gradient(40% 50% at 90% 15%,#4B556F 0%,transparent 70%),radial-gradient(50% 50% at 75% 95%,#757067 0%,transparent 70%),radial-gradient(35% 40% at 50% 10%,#D3B19E 0%,transparent 70%),linear-gradient(120deg,#AB5D44,#AC7A52 55%,#757067)}
.rp-sage{background:radial-gradient(55% 65% at 15% 80%,#576B5B 0%,transparent 75%),radial-gradient(55% 60% at 55% 55%,#6C7F6D 0%,transparent 72%),radial-gradient(40% 45% at 85% 20%,#AAB3A9 0%,transparent 70%),radial-gradient(45% 50% at 70% 85%,#84947F 0%,transparent 72%),linear-gradient(160deg,#576B5B,#6C7F6D 50%,#84947F)}
/* riso sweep */
.sweep{position:absolute;left:0;right:0;height:42%;top:-42%;z-index:3;mix-blend-mode:screen;opacity:.95;animation:sw 2.4s cubic-bezier(.45,0,.55,1) infinite;-webkit-mask-image:linear-gradient(180deg,transparent,#000 70%,#000 92%,transparent);mask-image:linear-gradient(180deg,transparent,#000 70%,#000 92%,transparent)}
.sweep .edge{position:absolute;left:0;right:0;bottom:8%;height:2px;background:rgba(255,255,255,.85);box-shadow:0 0 16px rgba(255,255,255,.6);z-index:2}
@keyframes sw{to{top:100%}}
.done .sweep{display:none}
.veil{position:absolute;inset:0;z-index:2;background:rgba(0,0,0,.18);transition:background .5s}
.done .veil{background:rgba(0,0,0,0)}
/* boxes */
.bx{position:absolute;z-index:4;border-radius:12px;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.9),0 0 0 1px rgba(0,0,0,.15);opacity:0;transform:scale(1.06);transition:opacity .4s var(--e),transform .5s var(--e),box-shadow .3s}
.bx.on{opacity:1;transform:none}
.bx .lb{position:absolute;left:4px;top:4px;transform-origin:left top;height:22px;padding:0 8px 0 3px;border-radius:11px;background:rgba(20,20,22,.55);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.2);display:flex;align-items:center;gap:5px;font-size:11px;font-weight:500;color:#fff;white-space:nowrap}
.bx .lb i{width:16px;height:16px;border-radius:50%;background:#fff;color:#0B0B0C;font-style:normal;font-size:10.5px;font-weight:700;display:grid;place-items:center}
.bx.off{box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.45)}
.bx.off .lb{opacity:.6;text-decoration:line-through}
/* overlay chips */
.status{position:absolute;z-index:5;left:12px;top:12px;height:30px;padding:0 12px 0 10px;border-radius:15px;background:rgba(20,20,22,.5);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.18);display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:500;color:#fff}
.status .dot{width:8px;height:8px;border-radius:50%;background:#fff;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.3;transform:scale(.75)}}
.done .status .dot{animation:none;background:#fff}
.count{position:absolute;z-index:5;right:12px;top:12px;height:30px;padding:0 12px;border-radius:15px;background:rgba(20,20,22,.5);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.18);display:flex;align-items:center;font-size:12.5px;font-weight:500;color:#fff;font-variant-numeric:tabular-nums}
/* text */
.txt{padding:16px 10px 6px}
.txt h3{font-family:'Inter Tight',Inter,sans-serif;font-weight:400;font-size:26px;letter-spacing:-.02em;line-height:1.1}
.txt p{font-size:14.5px;color:var(--tx2);margin-top:6px;line-height:1.45;min-height:21px}
.bar{height:3px;border-radius:2px;background:rgba(255,255,255,.08);margin:14px 10px 0;overflow:hidden}
.bar i{display:block;height:100%;width:6%;background:#F4F4F5;border-radius:2px;transition:width .7s var(--e)}
.done .bar{display:none}
.tiles{display:flex;gap:8px;overflow-x:auto;padding:14px 10px 2px;scrollbar-width:none}
.tiles::-webkit-scrollbar{display:none}
.tile{flex:none;width:76px;text-align:left;animation:tin .45s var(--e) both}
@keyframes tin{from{opacity:0;transform:translateX(16px)}}
.tile .im{width:76px;height:76px;border-radius:16px;background-repeat:no-repeat;box-shadow:inset 0 0 0 1px var(--line);position:relative}
.tile .im i{position:absolute;left:5px;top:5px;width:18px;height:18px;border-radius:50%;background:#fff;color:#0B0B0C;font-style:normal;font-size:10.5px;font-weight:700;display:grid;place-items:center}
.tile b{display:block;font-size:12px;font-weight:500;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile.sk .im{background:var(--s2);overflow:hidden}
.tile.sk .im::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.07) 50%,transparent 70%);background-size:200% 100%;animation:sh 1.4s linear infinite}
.tile.sk b{width:44px;height:9px;border-radius:5px;background:var(--s2);margin-top:9px}
@keyframes sh{from{background-position:150% 0}to{background-position:-50% 0}}
.tile.off{opacity:.4}
.acts{display:none;gap:8px;padding:16px 2px 2px}
.done .acts{display:flex}
.acts button{height:50px;border-radius:25px;font-weight:600;font-size:15.5px;display:flex;align-items:center;justify-content:center;gap:8px}
.acts .w{flex:1.6;background:linear-gradient(180deg,#F4F4F5,#D4D4D8);color:#0B0B0C;box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 8px 24px rgba(0,0,0,.35)}
.acts .g{flex:1;box-shadow:inset 0 0 0 1px var(--line2)}
.acts button:active{transform:scale(.98)}
.foot{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--tx3);padding:12px 10px 8px}
.foot svg{width:14px;height:14px}
.stopped{padding:22px 12px;text-align:center}
.stopped h3{font-family:'Inter Tight',Inter,sans-serif;font-weight:400;font-size:22px}
.stopped p{font-size:14px;color:var(--tx2);margin-top:6px}
.stopped button{margin-top:14px;height:44px;padding:0 18px;border-radius:22px;box-shadow:inset 0 0 0 1px var(--line2);font-weight:600;font-size:14.5px}
/* composer */
.fade{position:absolute;left:0;right:0;bottom:0;height:170px;background:linear-gradient(rgba(0,0,0,0),#000 45%);z-index:6;pointer-events:none}
.cmp{position:absolute;left:10px;right:10px;bottom:28px;z-index:7;border-radius:30px;background:linear-gradient(180deg,#19191C,#131315);box-shadow:0 0 0 1px rgba(255,255,255,.09),inset 0 1px 0 rgba(255,255,255,.06);padding:16px 10px 10px 20px}
.cmp input{width:100%;background:none;border:0;outline:0;color:var(--tx);font:inherit;font-size:17px}
.cmp input::placeholder{color:var(--tx3)}
.cmp .row{display:flex;align-items:center;margin-top:14px}
.cmp .c{width:44px;height:44px;border-radius:50%;display:grid;place-items:center}
.cmp .plus{margin-left:-12px}
.cmp .sp{flex:1}
.cmp .act{width:46px;height:46px;border-radius:50%;background:#F4F4F5;color:#0B0B0C;display:grid;place-items:center}
.cmp .act i{width:13px;height:13px;border-radius:3px;background:#0B0B0C;display:block}
.cmp .act.send{background:#2A2A2E;color:#6B6B70}
.cmp .act.send.on{background:#F4F4F5;color:#0B0B0C}
.toast{position:absolute;left:50%;top:110px;transform:translate(-50%,-14px);background:#F4F4F5;color:#0B0B0C;font-weight:600;font-size:14px;padding:10px 16px;border-radius:20px;z-index:20;opacity:0;transition:all .4s var(--e);pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
.side{width:270px;color:#C8C8CC;font-size:13.5px;line-height:1.55}
.side h2{font-size:15px;color:#fff;font-weight:600;margin-bottom:8px}
.side b{color:#fff;font-weight:600}
.side ol{padding-left:18px;display:flex;flex-direction:column;gap:6px;margin-top:6px}
.pal{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 16px}
.pal button{height:34px;padding:0 12px 0 6px;border-radius:17px;background:#1A1A1C;color:#C8C8CC;font-size:12.5px;font-weight:500;display:flex;align-items:center;gap:8px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.pal button.on{color:#fff;box-shadow:inset 0 0 0 1.5px #fff}
.pal button i{width:22px;height:22px;border-radius:50%}
.rp{margin-top:16px;height:40px;padding:0 16px;border-radius:20px;background:#2E2E31;color:#fff;font-weight:600;font-size:13.5px}
@media (prefers-reduced-motion:reduce){.sweep{display:none}*{animation-duration:.01s!important;transition-duration:.01s!important}}

const $=id=>document.getElementById(id);
const ITEMS=[{n:'Headphones',b:[0,19,83,37]},{n:'Mac mini',b:[4,10,44,16]},{n:'Keyboard',b:[57,61,43,39]},{n:'Candle',b:[81,21,19,18]}];
let palette='plum',timers=[],state='scan',on=[];
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),1700)}
function crop(b){const [x,y,w,h]=b;const sx=100/w*100,sy=100/h*100;const px=w>=100?0:x/(100-w)*100,py=h>=100?0:y/(100-h)*100;return `background-image:url(${PHOTO});background-size:${sx}% ${sy}%;background-position:${px}% ${py}%`}
function lower(a){return a.map(x=>x.n.toLowerCase().replace('mac mini','a Mac mini'))}
function found(k){const n=k+1;return n===1?`Found ${lower(ITEMS.slice(0,1))[0]} so far`:`Found ${lower(ITEMS.slice(0,n)).slice(0,-1).join(', ')} and ${lower(ITEMS.slice(0,n)).at(-1)} so far`}
function run(){timers.forEach(clearTimeout);timers=[];state='scan';on=ITEMS.map(()=>true);
 $('inp').placeholder='Add a note while scanning…';setAct('stop');
 $('msgs').innerHTML=`<div class="card" id="card"><div class="stage" id="stage"><div class="art grain rp-${palette}"></div><div class="bgph" style="background-image:url(${PHOTO})"></div><div class="ph" id="ph" style="background-image:url(${PHOTO})">
  <div class="veil"></div><div class="sweep grain rp-${palette}" id="sweep"><span class="edge"></span></div><div id="boxes"></div></div>
  <span class="status"><span class="dot"></span><span id="stx">Scanning</span></span><span class="count" id="cnt">0 found</span></div>
  <div class="txt"><h3 id="ttl">Looking at your photo</h3><p id="sub">Checking shapes and labels…</p></div>
  <div class="bar"><i id="bar"></i></div>
  <div class="tiles" id="tiles"><div class="tile sk"><div class="im"></div><b></b></div><div class="tile sk"><div class="im"></div><b></b></div><div class="tile sk"><div class="im"></div><b></b></div></div>
  <div class="acts"><button class="w" id="rev" onclick="review()">Review 4 items</button><button class="g" onclick="toast('Opens the camera')">Retake</button></div>
  <div class="foot"><svg class="i" viewBox="0 0 24 24"><rect x="5" y="10.5" width="14" height="10" rx="2.5"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/></svg>Nothing is saved until you review and approve.</div></div>`;
 setTimeout(()=>$('bar').style.width='14%',50);
 ITEMS.forEach((it,k)=>timers.push(setTimeout(()=>add(it,k),1300+k*1100)));
 timers.push(setTimeout(finish,1300+ITEMS.length*1100+600))}
function add(it,k){const [x,y,w,h]=it.b;$('boxes').insertAdjacentHTML('beforeend',`<div class="bx" id="bx${k}" style="left:${x}%;top:${y}%;width:${w}%;height:${h}%" onclick="tog(${k})"><span class="lb" style="${x+w>90&&w<30?'left:auto;right:4px':''}"><i>${k+1}</i>${it.n}</span></div>`);
 requestAnimationFrame(()=>requestAnimationFrame(()=>$('bx'+k).classList.add('on')));
 $('cnt').textContent=`${k+1} found`;$('sub').textContent=found(k);$('bar').style.width=Math.round(14+(k+1)/ITEMS.length*76)+'%';
 const t=$('tiles');const sk=t.querySelector('.sk');t.insertBefore(Object.assign(document.createElement('div'),{innerHTML:`<button class="tile" id="tl${k}" onclick="tog(${k})"><div class="im" style="${crop(it.b)}"><i>${k+1}</i></div><b>${it.n}</b></button>`}).firstChild,sk);
 const sks=t.querySelectorAll('.sk');if(sks.length>1)sks[0].remove()}
function finish(){if(state!=='scan')return;state='done';$('card').classList.add('done');$('stx').textContent='Done';$('bar').style.width='100%';
 document.querySelectorAll('#tiles .sk').forEach(e=>e.remove());$('ttl').textContent=`${ITEMS.length} items found`;$('sub').textContent='Tap an item to leave it out, then review and save.';
 $('inp').placeholder='Ask about these items…';setAct('send');upd();setTimeout(()=>{const m=$('msgs');m.scrollTo({top:m.scrollHeight,behavior:'smooth'})},250)}
function tog(k){if(state!=='done')return;on[k]=!on[k];$('bx'+k).classList.toggle('off',!on[k]);$('tl'+k).classList.toggle('off',!on[k]);upd()}
function upd(){const n=on.filter(Boolean).length;$('rev').textContent=n?`Review ${n} item${n>1?'s':''}`:'Select items';$('rev').disabled=!n;$('rev').style.opacity=n?1:.4;$('cnt').textContent=`${n} of ${ITEMS.length} selected`}
function review(){toast('Opens the existing review')}
function stop(){if(state!=='scan')return;timers.forEach(clearTimeout);state='stopped';setAct('send');$('inp').placeholder='Ask FindEZ…';
 $('card').innerHTML=`<div class="stopped"><h3>Scan stopped</h3><p>Nothing was saved.</p><button onclick="run()">Scan again</button></div>`}
function setAct(m){const a=$('act');if(m==='stop'){a.className='act';a.innerHTML='<i></i>';a.onclick=stop;a.setAttribute('aria-label','Stop')}else{a.className='act send';a.innerHTML='<svg class="i" viewBox="0 0 24 24" style="width:19px;height:19px;stroke-width:2.3"><path d="M12 19V5M6 11l6-6 6 6"/></svg>';a.onclick=()=>{if($('inp').value.trim()){toast('Sent');$('inp').value='';sync()}};a.setAttribute('aria-label','Send')}sync()}
function sync(){const a=$('act');if(a.classList.contains('send'))a.classList.toggle('on',!!$('inp').value.trim())}
function pal(p){palette=p;document.querySelectorAll('.pal button').forEach(b=>b.classList.toggle('on',b.dataset.p===p));run()}
run();
</script></body></html>
