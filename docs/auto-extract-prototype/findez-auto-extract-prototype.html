<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FindEZ Auto Extract Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#111112;--s1:#1C1C1E;--s2:#232325;--s3:#2C2C2F;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.13);--tx:#FAFAFA;--tx2:#9A9AA0;--tx3:#5F5F64;--w:#F2F2F2;--amber:#C9A04E;--e:cubic-bezier(.32,.72,0,1)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#050506;font-family:Inter,-apple-system,system-ui,sans-serif;-webkit-font-smoothing:antialiased;color:var(--tx)}
body{display:flex;align-items:center;justify-content:center}
.dev{width:390px;height:844px;border-radius:54px;background:var(--bg);position:relative;overflow:hidden;box-shadow:0 0 0 9px #1C1C1F,0 0 0 10px #333,0 40px 100px rgba(0,0,0,.6)}
@media (max-width:500px){body{display:block}.dev{width:100vw;height:100dvh;border-radius:0;box-shadow:none}}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.top{position:absolute;top:0;left:0;right:0;padding:50px 14px 10px;display:flex;align-items:center;justify-content:space-between;z-index:10;background:linear-gradient(var(--bg) 70%,rgba(17,17,18,0))}
.top b{font-weight:600;font-size:17px}
.ib{width:44px;height:44px;border-radius:50%;background:var(--s1);box-shadow:inset 0 0 0 1px var(--line2);display:grid;place-items:center}
.msgs{position:absolute;inset:0;overflow-y:auto;padding:110px 16px 130px;scroll-behavior:smooth;scrollbar-width:none}
.msgs::-webkit-scrollbar{display:none}
.empty{position:absolute;left:24px;right:24px;top:36%;text-align:center;transition:opacity .4s}
.empty h1{font-size:28px;font-weight:600;letter-spacing:-.025em}
.empty p{color:var(--tx2);font-size:15.5px;margin-top:10px;line-height:1.45}
.empty .chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:22px}
.chip{height:40px;padding:0 15px;border-radius:20px;background:var(--s1);box-shadow:inset 0 0 0 1px var(--line);display:inline-flex;align-items:center;gap:8px;font-size:14.5px;color:var(--tx2)}
.chip:hover{color:var(--tx)}
.m{animation:in .45s var(--e) both}@keyframes in{from{opacity:0;transform:translateY(10px)}}
.u{margin:14px 0 0 auto;width:fit-content;max-width:80%;background:var(--s3);border-radius:20px 20px 6px 20px;padding:11px 15px;font-size:15.5px;line-height:1.4}
.uph{margin:14px 0 0 auto;width:200px;aspect-ratio:900/540;border-radius:20px 20px 6px 20px;background:center/cover}
.f{display:flex;gap:10px;margin-top:16px}
.av{width:28px;height:28px;border-radius:8px;background:#fff;display:grid;place-items:center;flex:none;margin-top:1px}
.fb{flex:1;min-width:0}
.fb p{font-size:15.5px;line-height:1.5}.fb p b{font-weight:600}
.fb .sub{color:var(--tx2);font-size:13.5px;margin-top:2px;min-height:19px}
.dots{display:inline-flex;gap:4px;margin-left:6px;vertical-align:middle}.dots i{width:5px;height:5px;border-radius:50%;background:var(--tx2);animation:bl 1.2s infinite}.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,100%{opacity:.25}40%{opacity:1}}
.pv{position:relative;margin-top:12px;width:100%;border-radius:18px;overflow:hidden;background:#000}
.pv img{display:block;width:100%}
.sweep{position:absolute;left:0;right:0;height:45%;top:-45%;background:linear-gradient(180deg,rgba(255,255,255,0),rgba(255,255,255,.22) 85%,rgba(255,255,255,.8));animation:sw 1.8s cubic-bezier(.45,0,.55,1) infinite}
@keyframes sw{to{top:100%}}
.bx{position:absolute;border:2px solid #fff;border-radius:10px;transition:opacity .35s var(--e),transform .45s var(--e),border-color .3s;cursor:pointer}
.bx.new{opacity:0;transform:scale(1.12)}
.bx.off{border-style:dashed;border-color:rgba(255,255,255,.5)}
.bx i{position:absolute;right:-9px;top:-9px;width:20px;height:20px;border-radius:50%;background:#fff;color:#0B0B0C;font-style:normal;font-size:11px;font-weight:700;display:grid;place-items:center}
.bx.off i{background:rgba(255,255,255,.55)}
.bx.hl{box-shadow:0 0 0 4px rgba(255,255,255,.3)}
.bar{height:3px;border-radius:2px;background:var(--s2);margin-top:12px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:#fff;border-radius:2px;transition:width .5s var(--e)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.tl{position:relative;border-radius:16px;background:var(--s1);box-shadow:inset 0 0 0 1px var(--line);padding:8px 8px 8px 8px;display:flex;gap:10px;align-items:center;text-align:left;transition:opacity .25s,box-shadow .25s,transform .2s}
.tl:active{transform:scale(.98)}
.tl .im{width:46px;height:46px;border-radius:11px;background:center/cover;flex:none;position:relative}
.tl .im i{position:absolute;left:-5px;top:-5px;width:18px;height:18px;border-radius:50%;background:#fff;color:#0B0B0C;font-style:normal;font-size:10px;font-weight:700;display:grid;place-items:center}
.tl .tx{flex:1;min-width:0}.tl b{display:block;font-size:13.5px;font-weight:600;line-height:1.2;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.tl span{display:block;font-size:12px;color:var(--tx2);margin-top:3px}
.tl .ed{position:absolute;right:6px;top:6px;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:var(--tx3)}
.tl .ed svg{width:14px;height:14px}
.tl.off{opacity:.42}.tl.off b{text-decoration:line-through}
.tl.hl{box-shadow:inset 0 0 0 1.5px #fff}
.tl.sk{height:62px;background:var(--s1)}.tl.sk::after{content:"";position:absolute;inset:0;border-radius:16px;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.06) 50%,transparent 70%);background-size:200% 100%;animation:sh 1.4s linear infinite}
@keyframes sh{from{background-position:150% 0}to{background-position:-50% 0}}
.row2{display:flex;gap:8px;margin-top:12px}
.sp{flex:1;min-width:0;display:flex;align-items:center;gap:6px;height:46px;border-radius:23px;background:var(--s2);padding:0 12px 0 14px;font-size:14px;font-weight:600;white-space:nowrap}
.sp span{overflow:hidden;text-overflow:ellipsis;flex:1;text-align:left}
.pri{flex:1.15;height:46px;border-radius:23px;background:var(--w);color:#0B0B0C;font-weight:600;font-size:15px;transition:opacity .2s,transform .15s}
.pri:active{transform:scale(.97)}.pri:disabled{opacity:.35}
.hint{font-size:12.5px;color:var(--tx3);margin-top:8px}
.saved{margin-top:4px;padding:12px;border-radius:18px;background:var(--s1);box-shadow:inset 0 0 0 1px var(--line);display:flex;align-items:center;gap:10px;font-size:14.5px}
.saved .ck{width:24px;height:24px;border-radius:50%;background:#fff;color:#0B0B0C;display:grid;place-items:center;flex:none}
.saved .ck svg{width:13px;height:13px;stroke-width:3}
.saved .st{display:flex;margin-left:auto}.saved .st span{width:30px;height:30px;border-radius:8px;background:center/cover;margin-left:-8px;box-shadow:0 0 0 2px var(--s1)}
.acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.sec{height:38px;padding:0 15px;border-radius:19px;background:var(--s2);font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:7px}
.icard{display:flex;gap:12px;align-items:center;margin-top:10px;padding:10px;border-radius:18px;background:var(--s1);box-shadow:inset 0 0 0 1px var(--line)}
.icard .im{width:56px;height:56px;border-radius:13px;background:center/cover;flex:none}
.icard b{display:block;font-weight:600;font-size:15px}.icard span{display:flex;align-items:center;gap:5px;font-size:12.5px;color:var(--tx2);margin-top:3px}
.icard span svg{width:13px;height:13px}
.icard .q{margin-left:auto;font-size:22px;font-weight:700;padding-right:6px}
.sugs{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.sugs .chip{height:36px;font-size:13.5px}
.cmp{position:absolute;left:12px;right:12px;bottom:26px;z-index:12;min-height:58px;border-radius:29px;background:var(--s1);box-shadow:inset 0 0 0 1px var(--line2),0 -14px 40px rgba(0,0,0,.6);display:flex;align-items:center;gap:4px;padding:6px}
.cmp .c{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:var(--tx);flex:none}
.cmp .plus{box-shadow:inset 0 0 0 1px var(--line2)}
.cmp input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--tx);font:inherit;font-size:16px;padding:0 6px}
.cmp input::placeholder{color:var(--tx3)}
.cmp .send{background:var(--s3);color:var(--tx3);transition:background .2s,color .2s}
.cmp .send.on{background:var(--w);color:#0B0B0C}
.cmp .stop{background:var(--w)}.cmp .stop i{width:12px;height:12px;border-radius:3px;background:#0B0B0C;display:block}
.fade{position:absolute;left:0;right:0;bottom:0;height:120px;background:linear-gradient(rgba(17,17,18,0),var(--bg) 55%);z-index:11;pointer-events:none}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.55);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);z-index:20;opacity:0;pointer-events:none;transition:opacity .35s var(--e)}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:8px;right:8px;bottom:8px;border-radius:38px;background:#1A1A1C;box-shadow:inset 0 0 0 1px var(--line2),0 -20px 60px rgba(0,0,0,.6);z-index:21;padding:10px 18px 26px;transform:translateY(110%);transition:transform .5s var(--e);max-height:80%;pointer-events:none;overflow-y:auto}
.sheet.on{transform:none;pointer-events:auto}
.grab{width:38px;height:5px;border-radius:3px;background:rgba(255,255,255,.2);margin:0 auto 14px}
.sheet h3{font-size:22px;font-weight:700;letter-spacing:-.02em}.sheet .s{color:var(--tx2);font-size:14.5px;margin-top:4px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.opt{border-radius:22px;background:var(--s2);padding:0;overflow:hidden;text-align:left}
.opt .im{height:110px;background:center/cover}
.opt div{padding:11px 13px 13px}.opt b{display:block;font-weight:600;font-size:15px}.opt span{display:block;font-size:12.5px;color:var(--tx2);margin-top:2px}
.lst{margin-top:12px}
.lrow{display:flex;align-items:center;gap:12px;width:100%;padding:11px 10px;border-radius:16px;text-align:left}
.lrow:hover,.lrow.on{background:var(--s2)}
.lrow .g{width:42px;height:42px;border-radius:12px;flex:none}
.lrow b{display:block;font-weight:600;font-size:15.5px}.lrow span{display:block;font-size:12.5px;color:var(--tx2);margin-top:1px}
.lrow .ok{margin-left:auto;width:24px;height:24px;border-radius:50%;background:#fff;color:#0B0B0C;display:none;place-items:center}.lrow.on .ok{display:grid}.lrow .ok svg{width:13px;height:13px;stroke-width:3}
.lab{font-size:12.5px;font-weight:600;color:var(--tx3);margin:14px 10px 4px}
.field{display:block;width:100%;border-radius:16px;background:var(--s2);padding:10px 14px;margin-top:10px}
.field small{display:block;font-size:11.5px;color:var(--tx2);font-weight:500}
.field input{width:100%;background:none;border:0;outline:0;color:var(--tx);font:inherit;font-size:16.5px;font-weight:500;margin-top:2px}
.search{display:flex;align-items:center;gap:8px;height:46px;border-radius:23px;background:var(--s2);padding:0 14px;margin-top:14px;color:var(--tx2)}
.search input{flex:1;background:none;border:0;outline:0;color:var(--tx);font:inherit;font-size:15.5px}
.stp{display:flex;align-items:center;gap:14px;margin-top:4px}.stp button{width:34px;height:34px;border-radius:50%;background:var(--s3);display:grid;place-items:center}.stp b{font-size:20px;font-weight:600;min-width:36px;text-align:center}
.erow{display:flex;gap:10px}.erow .field{flex:1}
.crop{height:150px;border-radius:20px;background:center/cover;margin-bottom:4px}
.brow{display:flex;gap:10px;margin-top:16px}.brow button{flex:1;height:52px;border-radius:26px;font-weight:600;font-size:15.5px}
.brow .sec2{background:var(--s2)}.brow .red{background:var(--s2);color:#E5484D}.brow .w{background:var(--w);color:#0B0B0C;flex:1.4}
.g-slate{background:radial-gradient(70% 70% at 25% 25%,#D9DCE0,transparent 70%),radial-gradient(70% 70% at 80% 85%,#2A2D33,transparent 72%),linear-gradient(150deg,#B9BEC5,#6E747D 50%,#24272C)}
.g-moss{background:radial-gradient(70% 70% at 80% 20%,#E3C9A6,transparent 70%),radial-gradient(70% 70% at 15% 85%,#24493F,transparent 72%),linear-gradient(160deg,#3E5A4C,#6F8C74 50%,#22322C)}
.g-dusk{background:radial-gradient(70% 70% at 25% 20%,#B7C3CC,transparent 70%),radial-gradient(70% 70% at 80% 85%,#1A1C33,transparent 72%),linear-gradient(150deg,#9AA6B2,#4E5878 50%,#151729)}
.g-plum{background:radial-gradient(70% 70% at 82% 22%,#E8B9A6,transparent 70%),radial-gradient(70% 70% at 15% 85%,#241D3D,transparent 72%),linear-gradient(160deg,#2B2440,#6B5486 50%,#A7808F)}
.toast{position:absolute;left:50%;top:104px;transform:translate(-50%,-20px);background:#F2F2F2;color:#0B0B0C;font-weight:600;font-size:14px;padding:10px 16px;border-radius:20px;z-index:30;opacity:0;transition:all .4s var(--e);pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
.demo{position:fixed;left:16px;bottom:16px;color:#5F5F64;font-size:12px}
@media (max-width:500px){.demo{display:none}}
@media (prefers-reduced-motion:reduce){.sweep{display:none}*{animation-duration:.01s!important;transition-duration:.01s!important}}
</style></head><body>
<div class="dev" id="dev">
  <div class="top"><button class="ib" aria-label="Back" onclick="toast('Back to home')"><svg class="i" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button><b>Ask</b><button class="ib" aria-label="New chat" onclick="reset()"><svg class="i" viewBox="0 0 24 24" style="width:18px;height:18px"><path d="M12 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.4 2.6a2.1 2.1 0 0 1 3 3L12 15l-4 1 1-4Z"/></svg></button></div>
  <div class="msgs" id="msgs"></div>
  <div class="empty" id="empty"><h1>What's in your world?</h1><p>Snap a shelf, drawer or bin and FindEZ lists every item.<br>Or just tell it what you have.</p>
    <div class="chips"><button class="chip" onclick="openAdd()"><svg class="i" viewBox="0 0 24 24" style="width:17px;height:17px"><path d="M14.5 4h-5L7.5 6.5h-3a2 2 0 0 0-2 2V18a2 2 0 0 0 2 2h15a2 2 0 0 0 2-2V8.5a2 2 0 0 0-2-2h-3Z"/><circle cx="12" cy="13" r="3.5"/></svg>Snap a shelf</button><button class="chip" onclick="ask('Where did I put my drill?')">Where did I put my drill?</button></div></div>
  <div class="fade"></div>
  <div class="cmp"><button class="c plus" aria-label="Add" onclick="openAdd()"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
    <input id="inp" placeholder="Ask FindEZ…" autocomplete="off" oninput="syncSend()" onkeydown="if(event.key==='Enter')submit()">
    <button class="c" aria-label="Voice" onclick="toast('Voice input')"><svg class="i" viewBox="0 0 24 24"><rect x="9" y="2.5" width="6" height="12" rx="3"/><path d="M19 10.5v.5a7 7 0 0 1-14 0v-.5M12 18v3.5"/></svg></button>
    <button class="c send" id="send" aria-label="Send" onclick="submit()"><svg class="i" viewBox="0 0 24 24" style="width:18px;height:18px;stroke-width:2.2"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button></div>
  <div class="scrim" id="scrim" onclick="closeSheets()"></div>
  <div class="sheet" id="shAdd"><div class="grab"></div><h3>Add from a photo</h3><p class="s">Snap a shelf, drawer or bin. FindEZ lists every item, and nothing saves until you approve.</p>
    <div class="opts"><button class="opt" onclick="startScan('bench')"><div class="im" id="optBench"></div><div><b>Workbench</b><span>Demo photo</span></div></button><button class="opt" onclick="startScan('bin')"><div class="im" id="optBin"></div><div><b>Parts bin</b><span>Demo photo</span></div></button></div>
    <div class="brow"><button class="sec2" onclick="toast('Opens the camera')"><span style="display:inline-flex;gap:8px;align-items:center"><svg class="i" viewBox="0 0 24 24" style="width:18px;height:18px"><path d="M14.5 4h-5L7.5 6.5h-3a2 2 0 0 0-2 2V18a2 2 0 0 0 2 2h15a2 2 0 0 0 2-2V8.5a2 2 0 0 0-2-2h-3Z"/><circle cx="12" cy="13" r="3.5"/></svg>Camera</span></button><button class="sec2" onclick="toast('Opens your photo library')">Library</button></div></div>
  <div class="sheet" id="shEdit"></div>
  <div class="sheet" id="shSpace"></div>
  <div class="toast" id="toast"></div>
</div>

const $=id=>document.getElementById(id),msgs=$('msgs');

function toast(t){const e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),1600)}
function scroll(){requestAnimationFrame(()=>msgs.scrollTop=msgs.scrollHeight)}
function add(html){$('empty').style.opacity=0;$('empty').style.pointerEvents='none';const d=document.createElement('div');d.className='m';d.innerHTML=html;msgs.appendChild(d);scroll();return d}
function syncSend(){$('send').classList.toggle('on',!!$('inp').value.trim())}
function setStop(on){const s=$('send');if(on){s.className='c stop';s.innerHTML='<i></i>';s.onclick=stopScan;$('inp').placeholder='FindEZ is looking…'}else{s.className='c send';s.innerHTML='<svg class="i" viewBox="0 0 24 24" style="width:18px;height:18px;stroke-width:2.2"><path d="M12 19V5M6 11l6-6 6 6"/></svg>';s.onclick=submit;syncSend()}}
function openSheet(id){closeSheets(true);$('scrim').classList.add('on');$(id).classList.add('on')}
function closeSheets(keep){document.querySelectorAll('.sheet').forEach(s=>s.classList.remove('on'));if(!keep)$('scrim').classList.remove('on')}
function openAdd(){if(st.phase==='scan')return toast('Still looking at your photo');openSheet('shAdd')}
function reset(){timers.forEach(clearTimeout);msgs.innerHTML='';st={};saved=[];setStop(false);$('inp').placeholder='Ask FindEZ…';$('empty').style.opacity=1;$('empty').style.pointerEvents='auto'}
const fz=inner=>`<div class="f"><span class="av">${CLOVE}</span><div class="fb">${inner}</div></div>`;
// ---- scan ----
function startScan(key){closeSheets();const P=PHOTOS[key];st={phase:'scan',key,items:P.items.map((x,i)=>({...x,i,on:x.ok})),found:0};
 add(`<div class="uph" style="background-image:url(${IMG[P.img]})"></div>`);
 st.el=add(fz(`<p id="sTitle">Looking at your photo<span class="dots"><i></i><i></i><i></i></span></p><div class="sub" id="sSub"></div>
  <div class="pv" id="pv"><img src="${IMG[P.img]}" alt="Your photo"><div class="sweep" id="sweep"></div></div><div class="bar"><i id="sBar"></i></div>
  <div class="tiles" id="tiles"><div class="tl sk"></div><div class="tl sk"></div></div>`));
 setStop(true);
 const n=st.items.length;st.items.forEach((it,k)=>timers.push(setTimeout(()=>found(it,k,n),900+k*850)));
 timers.push(setTimeout(finish,900+n*850+500));
 $('sBar').style.width='8%';}
function boxHTML(it){const b=it.box;return `<div class="bx new${it.on?'':' off'}" id="bx${it.i}" style="left:${b[0]}%;top:${b[1]}%;width:${b[2]}%;height:${b[3]}%" onclick="toggle(${it.i})"><i>${it.i+1}</i></div>`}
function tileHTML(it){return `<div class="tl${it.on?'':' off'}" id="tl${it.i}" role="button" tabindex="0" onclick="toggle(${it.i})"><span class="im" style="background-image:url(${IMG[it.img]})"><i>${it.i+1}</i></span><div class="tx"><b>${it.name}</b><span>×${it.q}${it.ok?'':' · not sure'}</span></div><button class="ed" aria-label="Edit" onclick="event.stopPropagation();edit(${it.i})">${I('pen')}</button></div>`}
function found(it,k,n){st.found=k+1;$('pv').insertAdjacentHTML('beforeend',boxHTML(it));requestAnimationFrame(()=>requestAnimationFrame(()=>$('bx'+it.i).classList.remove('new')));
 const names=st.items.slice(0,k+1).map(x=>x.name.toLowerCase());$('sSub').textContent='Found '+names.join(', ');
 $('sBar').style.width=Math.round((k+1)/n*90)+'%';
 const tiles=$('tiles');const sk=tiles.querySelector('.sk');tiles.insertBefore(Object.assign(document.createElement('div'),{innerHTML:tileHTML(it)}).firstChild,sk);
 if(k+1>=2&&tiles.querySelectorAll('.sk').length>1)tiles.querySelector('.sk').remove();scroll()}
function finish(){if(st.phase!=='scan')return;st.phase='review';setStop(false);$('inp').placeholder='Or tell me what to change…';
 $('sweep').remove();$('sBar').parentNode.remove();document.querySelectorAll('#tiles .sk').forEach(e=>e.remove());
 const unsure=st.items.filter(x=>!x.ok);
 $('sTitle').innerHTML=`I found <b>${st.items.length} item${st.items.length>1?'s':''}</b>.`+(unsure.length?` I left out the ${unsure.map(x=>x.name.toLowerCase()).join(' and ')} because I'm not sure.`:'');
 $('sSub').textContent='';$('sSub').style.minHeight=0;
 st.el.querySelector('.fb').insertAdjacentHTML('beforeend',`<div class="row2" id="saveRow"><button class="sp" onclick="pickSpace()">${I('pin','width:17px;height:17px')}<span id="spName">${space.n}</span>${I('down','width:16px;height:16px;color:var(--tx2)')}</button><button class="pri" id="saveBtn" onclick="save()"></button></div><div class="hint" id="hint">Tap an item or its number to leave it out. Tap ✎ to edit.</div>`);
 updSave();scroll()}
function stopScan(){timers.forEach(clearTimeout);st.phase='stopped';setStop(false);$('inp').placeholder='Ask FindEZ…';st.el.querySelector('.fb').innerHTML='<p>Stopped. Nothing was saved.</p>';scroll()}
function updSave(){const n=st.items.filter(x=>x.on).length;const b=$('saveBtn');if(!b)return;b.textContent=n?`Save ${n} item${n>1?'s':''}`:'Select items';b.disabled=!n}
function toggle(i){if(st.phase!=='review'&&st.phase!=='scan')return;const it=st.items[i];it.on=!it.on;$('tl'+i).classList.toggle('off',!it.on);const bx=$('bx'+i);if(bx)bx.classList.toggle('off',!it.on);updSave();
 [`tl${i}`,`bx${i}`].forEach(id=>{const e=$(id);if(e){e.classList.add('hl');setTimeout(()=>e.classList.remove('hl'),500)}})}
function refreshTile(i){const it=st.items[i];const old=$('tl'+i);old.outerHTML=tileHTML(it);updSave()}
// ---- edit ----
function edit(i){const it=st.items[i];st.ed=i;st.edq=it.q;$('shEdit').innerHTML=`<div class="grab"></div><div class="crop" style="background-image:url(${IMG[it.img]})"></div>
 <label class="field"><small>Name</small><input id="eName" value="${it.name}"></label>
 <div class="erow"><div class="field"><small>Quantity</small><div class="stp"><button onclick="eq(-1)">${I('minus','width:16px;height:16px')}</button><b id="eQ">${it.q}</b><button onclick="eq(1)">${I('plus','width:16px;height:16px')}</button></div></div>
 <label class="field"><small>Details</small><input id="eDet" value="${it.det}"></label></div>
 <div class="brow"><button class="red" onclick="removeItem()">Leave out</button><button class="w" onclick="saveEdit()">Done</button></div>`;openSheet('shEdit')}
function eq(d){st.edq=Math.max(1,st.edq+d);$('eQ').textContent=st.edq}
function saveEdit(){const it=st.items[st.ed];it.name=$('eName').value.trim()||it.name;it.det=$('eDet').value;it.q=st.edq;it.on=true;refreshTile(st.ed);const bx=$('bx'+st.ed);if(bx)bx.classList.remove('off');closeSheets()}
function removeItem(){const it=st.items[st.ed];it.on=false;refreshTile(st.ed);const bx=$('bx'+st.ed);if(bx)bx.classList.add('off');closeSheets()}
// ---- space ----
function pickSpace(){renderSpaces('');openSheet('shSpace');setTimeout(()=>$('sq')&&$('sq').focus({preventScroll:true}),400)}
function renderSpaces(q){const f=SPACES.filter(s=>s.n.toLowerCase().includes(q.toLowerCase()));const groups={};f.forEach(s=>(groups[s.i]=groups[s.i]||[]).push(s));
 const n=st.items.filter(x=>x.on).length;
 $('shSpace').innerHTML=`<div class="grab"></div><h3>Save ${n} item${n>1?'s':''} to…</h3><div class="search">${I('search','width:17px;height:17px')}<input id="sq" placeholder="Search Spaces" value="${q}" oninput="renderSpaces(this.value);const e=$('sq');e.focus();e.setSelectionRange(e.value.length,e.value.length)"></div>
 <div class="lst">${Object.entries(groups).map(([g,ss])=>`<div class="lab">Season 2026-27 · ${g}</div>`+ss.map(s=>`<button class="lrow${s===space?' on':''}" onclick='chooseSpace("${s.n}")'><span class="g ${s.g}"></span><div><b>${s.n}</b><span>${s.i} · ${s.c?s.c+' items':'Empty'}</span></div><span class="ok">${I('check')}</span></button>`).join('')).join('')||'<p class="s" style="padding:12px 10px">No Spaces match.</p>'}
 <button class="lrow" onclick="newSpace()"><span class="g" style="background:var(--s3);display:grid;place-items:center">${I('plus','width:18px;height:18px')}</span><div><b>New Space${q?` "${q}"`:''}</b><span>Create it and save here</span></div></button></div>`}
function chooseSpace(n){space=SPACES.find(s=>s.n===n);$('spName').textContent=space.n;closeSheets()}
function newSpace(){const q=($('sq').value||'').trim()||'New Space';const s={n:q,i:'Hardware',c:0,g:'g-moss'};SPACES.push(s);chooseSpace(s.n);toast(`Created "${s.n}"`)}
// ---- save ----
function save(){const sel=st.items.filter(x=>x.on);if(!sel.length)return;st.phase='saved';
 sel.forEach(x=>{saved.push({...x,space:space.n});space.c+=x.q>0?1:0});
 const fb=st.el.querySelector('.fb');fb.style.transition='opacity .25s';fb.style.opacity=0;
 setTimeout(()=>{fb.innerHTML=`<div class="saved"><span class="ck">${I('check')}</span><span>Saved <b style="font-weight:600">${sel.length} item${sel.length>1?'s':''}</b> to ${space.n}</span><span class="st">${sel.slice(0,4).map(x=>`<span style="background-image:url(${IMG[x.img]})"></span>`).join('')}</span></div>
  <div class="acts"><button class="sec" onclick="toast('Opens ${space.n}')">Open ${space.n}</button><button class="sec" onclick="undo(this)">Undo</button></div>
  <div class="sugs"><button class="chip" onclick="ask('Where is the ${sel[0].name.toLowerCase()}?')">Where is the ${sel[0].name.toLowerCase()}?</button><button class="chip" onclick="openAdd()">Add another photo</button></div>`;fb.style.opacity=1;scroll()},250);
 $('inp').placeholder='Ask FindEZ…';st.lastSaved=sel}
function undo(btn){const n=st.lastSaved.length;saved=saved.slice(0,saved.length-n);btn.closest('.fb').innerHTML=`<p>Undone. Nothing from that photo was saved.</p>`;toast('Undone')}
// ---- chat ----
function submit(){const v=$('inp').value.trim();if(!v)return;$('inp').value='';syncSend();ask(v)}
function ask(q){add(`<div class="u">${q.replace(/</g,'&lt;')}</div>`);const typing=add(fz('<p><span class="dots" style="margin:0"><i></i><i></i><i></i></span></p>'));
 setTimeout(()=>{typing.remove();answer(q)},700)}
function answer(q){const l=q.toLowerCase();
 if(st.phase==='review'){const m=l.match(/(\d+)/);const it=st.items.find(x=>x.name.toLowerCase().split(' ').some(w=>w.length>3&&l.includes(w.replace(/s$/,''))));
  if(m&&it){it.q=+m[1];it.on=true;refreshTile(it.i);add(fz(`<p>Updated: <b>${it.name}</b> ×${it.q}.</p>`));return}
  if(it&&/(remove|leave out|not|skip|wrong)/.test(l)){it.on=false;refreshTile(it.i);add(fz(`<p>Left out <b>${it.name}</b>.</p>`));return}}
 const hit=saved.find(x=>x.name.toLowerCase().split(' ').some(w=>w.length>3&&l.includes(w.replace(/s$/,''))));
 if(hit){add(fz(`<p>It's in <b>${hit.space}</b>. You have <b>${hit.q}</b>.</p><div class="icard"><span class="im" style="background-image:url(${IMG[hit.img]})"></span><div><b>${hit.name}</b><span>${I('pin')}Hardware › ${hit.space}</span></div><span class="q">${hit.q}</span></div><div class="acts"><button class="sec" onclick="usedOne(this,'${hit.name}')">I used one</button><button class="sec" onclick="toast('Move ${hit.name}')">${I('move','width:15px;height:15px')}Move</button></div>`));return}
 if(/drill/.test(l)){add(fz(`<p>I don't see a drill in your inventory yet. Snap the shelf it's on and I'll remember it.</p><div class="acts"><button class="sec" onclick="openAdd()">Snap a shelf</button></div>`));return}
 add(fz(`<p>I couldn't find that in what you've saved yet. Try adding a photo of where it lives.</p>`))}
function usedOne(btn,n){const it=saved.find(x=>x.name===n);if(it.q>0)it.q--;btn.closest('.fb').querySelector('.q').textContent=it.q;toast(`${n}: ${it.q} left`)}
</script></body></html>
