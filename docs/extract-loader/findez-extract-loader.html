.card{position:absolute;left:50%;top:50.7%;transform:translate(-50%,-50%);width:80%;background:#fff;border-radius:26px;padding:16px 16px 18px;box-shadow:0 20px 50px rgba(0,0,0,.18);display:none}

.status span{position:absolute;left:0;right:0;transition:transform .35s,opacity .35s}
.status span.out{transform:translateY(-14px);opacity:0} .status span.in{transform:translateY(14px);opacity:0}

@keyframes bar{0%{left:-34%}100%{left:100%}}

/* A: scan */
.ph{position:relative;border-radius:16px;overflow:hidden;aspect-ratio:600/339;background:#222}
.ph img{width:100%;height:100%;object-fit:cover;display:block;animation:kb 6s ease-in-out infinite alternate}
@keyframes kb{to{transform:scale(1.07)}}
.ph::after{content:"";position:absolute;inset:0;background:rgba(17,17,18,.12)}
.scan{position:absolute;left:0;right:0;height:46%;top:-46%;z-index:2;background:linear-gradient(180deg,rgba(169,214,245,0),rgba(169,214,245,.35) 85%,rgba(255,255,255,.95) 100%);border-bottom:2px solid #fff;box-shadow:0 6px 18px rgba(169,214,245,.9);animation:scan 1.9s cubic-bezier(.45,0,.55,1) infinite}
@keyframes scan{0%{top:-46%}100%{top:100%}}
.cn{position:absolute;width:18px;height:18px;border:3px solid #fff;z-index:3;animation:cn 1.9s ease-in-out infinite}
.cn.a{left:10px;top:10px;border-right:0;border-bottom:0;border-radius:6px 0 0 0} .cn.b{right:10px;top:10px;border-left:0;border-bottom:0;border-radius:0 6px 0 0}
.cn.c{left:10px;bottom:10px;border-right:0;border-top:0;border-radius:0 0 0 6px} .cn.d{right:10px;bottom:10px;border-left:0;border-top:0;border-radius:0 0 6px 0}
@keyframes cn{50%{transform:scale(.88)}}
.box{position:absolute;z-index:4;border:2.5px solid var(--or);border-radius:10px;opacity:0}
.box b{position:absolute;left:-2px;top:-26px;white-space:nowrap;background:var(--or);color:var(--ink);font-family:'Geist Mono',ui-monospace,monospace;font-weight:500;font-size:11px;padding:3px 7px;border-radius:7px}
.box.k1{left:9%;top:12%;width:82%;height:76%;border-color:#fff;border-style:dashed} .box.k1 b{background:#fff;top:auto;bottom:-24px}
.box.k2{left:33%;top:55%;width:41%;height:19%}
.run .box.k1{animation:box .45s 1.1s forwards cubic-bezier(.2,.9,.3,1.3)}
.run .box.k2{animation:box .45s 2.5s forwards cubic-bezier(.2,.9,.3,1.3)}
@keyframes box{from{opacity:0;transform:scale(1.12)}to{opacity:1;transform:none}}
.sp{position:absolute;z-index:4;width:7px;height:7px;border-radius:2px;opacity:0}
.run .sp{animation:sp 1.2s infinite}
@keyframes sp{0%{opacity:0;transform:scale(.3) rotate(0)}40%{opacity:1}100%{opacity:0;transform:scale(1) rotate(90deg) translateY(-10px)}}

/* B: Pip */
.pipstage{position:relative;height:190px;display:grid;place-items:end center}
.pip{width:150px;height:150px;transform-origin:50% 92%;animation:bob .9s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) scale(1,1)}45%{transform:translateY(-8px) scale(.98,1.02) rotate(-2deg)}55%{transform:translateY(-8px) scale(.98,1.02) rotate(2deg)}85%{transform:translateY(0) scale(1.03,.97)}}
.pipstage .sh{position:absolute;bottom:2px;width:84px;height:10px;border-radius:50%;background:rgba(17,17,18,.08);animation:shd .9s ease-in-out infinite}
@keyframes shd{45%,55%{transform:scale(.8)}}
.pop{position:absolute;bottom:120px;left:50%;white-space:nowrap;font-size:12px;font-weight:500;background:#fff;border-radius:999px;padding:5px 10px 5px 8px;box-shadow:0 0 0 1px rgba(17,17,18,.08),0 8px 18px rgba(30,60,100,.16);display:flex;align-items:center;gap:6px;animation:pop 2.2s cubic-bezier(.2,.8,.3,1) forwards}

/* C: logo */
.logostage{height:150px;display:grid;place-items:center}

.lb{animation:lb 2.6s cubic-bezier(.3,.8,.3,1) infinite} .lk{transform-origin:43px 53px;animation:lk 2.6s cubic-bezier(.3,1.4,.4,1) infinite} .lo{transform-origin:60.75px 35.25px;animation:lo 2.6s cubic-bezier(.3,1.5,.4,1) infinite}
@keyframes lb{0%,12%{transform:translate(0,0);opacity:0}20%{opacity:1}40%,80%{transform:translate(-4.5px,4.5px);opacity:1}95%,100%{transform:translate(0,0);opacity:0}}
@keyframes lk{0%{transform:scale(.4);opacity:0}14%,82%{transform:scale(1);opacity:1}96%,100%{transform:scale(.4);opacity:0}}
@keyframes lo{0%,30%{transform:translateY(-22px) scale(.6);opacity:0}46%,78%{transform:none;opacity:1}86%{transform:translateY(-3px) rotate(8deg);opacity:1}96%,100%{transform:translateY(-22px) scale(.6);opacity:0}}

<script>
const NOTES={a:'Shows the real work: the captured photo gets scanned, then boxes land on what was found with live confidence. Best for trust.',
 b2:'Pip bobs right on the dimmed screen, no card. Found item names float up around him. Lighter and more playful.',
 b:'Pip bobs while found item names float up. Friendly and on-brand, good if extraction takes a while.',
 c:'The Blue echo mark builds itself: blue echo slides out, orange square drops in. Short and quiet.'};
const STEPS={a:['Looking at the photo...','Finding objects...','Reading labels...','Matching model numbers...','Almost done...'],
 b2:['Pip is looking...','Reading labels...','Counting items...','Matching model numbers...','Almost done...'],
 b:['Pip is looking...','Reading labels...','Counting items...','Matching model numbers...','Almost done...'],
 c:['Extracting items...','Reading labels...','Counting items...','Almost done...']};
const POPS=['Charger','Makita','DC18RC','Battery pack','Li-ion'];
let cur='a',timers=[];
function clear(){timers.forEach(clearInterval);timers.forEach(clearTimeout);timers=[];document.querySelectorAll('.pop').forEach(p=>p.remove())}
function cycle(card,steps){const box=card.querySelector('.status');let i=0;box.innerHTML='<span>'+steps[0]+'</span>';
 timers.push(setInterval(()=>{i=(i+1)%steps.length;const old=box.querySelector('span');old.classList.add('out');const s=document.createElement('span');s.className='in';s.textContent=steps[i];box.appendChild(s);
  requestAnimationFrame(()=>requestAnimationFrame(()=>s.classList.remove('in')));setTimeout(()=>old.remove(),400)},1500))}
function meta(card,fn){const m=card.querySelector('.meta');let t=0;m.textContent=fn(0);timers.push(setInterval(()=>{t++;m.textContent=fn(t)},700))}
function show(k){clear();cur=k;document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.k===k));
 document.querySelectorAll('.card').forEach(c=>c.classList.remove('on','run'));const c=document.getElementById(k);void c.offsetWidth;c.classList.add('on','run');
 document.getElementById('note').textContent=NOTES[k];cycle(c,STEPS[k]);
 if(k==='a'){meta(c,t=>t<2?'scanning':t<4?'1 object found':'1 object · 1 label read');timers.push(setInterval(()=>{c.classList.remove('run');void c.offsetWidth;c.classList.add('run')},7500))}
 document.getElementById('veil').classList.toggle('on',k==='b2');
 if(k==='b'||k==='b2'){let n=0;meta(c,t=>Math.min(Math.floor(t/2),POPS.length)+' found');const st=c.querySelector('.pipstage');
  const spawn=()=>{const p=document.createElement('div');p.className='pop';p.style.setProperty('--x',((n%2?1:-1)*(40+Math.random()*30))+'px');p.innerHTML='<i></i>'+POPS[n%POPS.length];n++;st.appendChild(p);setTimeout(()=>p.remove(),2300)};
  spawn();timers.push(setInterval(spawn,1400))}
 if(k==='c'){meta(c,t=>'step '+(Math.floor(t/2)%4+1)+' of 4')}
}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>show(b.dataset.k==='r'?cur:b.dataset.k));
show('b2');
</script>
